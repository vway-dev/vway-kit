# 브랜치 네이밍 검증 (Git-flow). vway-kit 은 PR 미사용 → push 트리거.
# 보호 브랜치(main/stage/dev)와 작업 브랜치 접두 패턴만 허용.
name: branch-naming

on:
  push:
    # 태그 push 는 github.ref_name 에 태그 이름을 실음 — branches 필터를 걸어야 태그가 빠짐.
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Checking: $BRANCH"
          PATTERNS=(
            "^main$" "^stage$" "^dev$"
            "^feature/[a-zA-Z0-9][a-zA-Z0-9._/-]*$"
            "^fix/[a-zA-Z0-9][a-zA-Z0-9._/-]*$"
            "^docs/[a-zA-Z0-9][a-zA-Z0-9._/-]*$"
            "^hotfix/[a-zA-Z0-9][a-zA-Z0-9._/-]*$"
            "^release/[0-9]+\.[0-9]+\.[0-9]+$"
            "^dependabot/.+$"
            "^renovate/.+$"
          )
          for p in "${PATTERNS[@]}"; do
            if [[ "$BRANCH" =~ $p ]]; then
              echo "✅ matches: $p"; exit 0
            fi
          done
          echo "❌ Invalid branch name: $BRANCH"
          echo "허용: main/stage/dev, feature/*, fix/*, docs/*, hotfix/*, release/x.y.z, dependabot/*, renovate/*"
          exit 1

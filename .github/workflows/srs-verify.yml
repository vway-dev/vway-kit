# github/srs-verify.workflow.example.yml 의 도그푸드(CLAUDE.md: 워크플로 렌더 기능은 이
# 저장소 자신의 CI 에도 내려감). 여기는 호스트 설치가 없어 SOURCE 스크립트를 직접 돌리고,
# 여기엔 docs/srs 가 없으므로 이 실행은 SRS 없는 소비자가 의지하는 무출력 green 계약을
# 그대로 태운다.
name: srs-verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  srs-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify SRS anchors and links
        run: python3 scripts/srs_check.py --verify

# 스킬 호출 eval 프롬프트 코퍼스 — 기대 스킬 id 는 키에서 파생한다(vway-kit:<key>).
#
# `fixture:` 는 케이스를 **프롬프트가 전제하는 프로젝트 안에서** 돌리게 한다.
# 효과 크기가 아니라 타당도 논거다 — playwright-scaffold 의 트리거는 "웹 프로젝트인데
# spec 이 없다" 인데 빈 디렉터리에는 웹 프로젝트가 없으므로, 거기서 나온 숫자는 그 스킬에
# 관한 측정이 아니다. 값은 scripts/skill_sandbox.py 의 시나리오명이고, 오타는 조용히 빈
# 디렉터리로 폴백하지 않고 load_cases 가 차단한다.
#
# **케이스별 오버라이드가 이 파일의 진짜 위험 지점이다.** 프롬프트가 픽스처와 모순되면
# 에이전트는 그 모순을 해소하는 데 턴을 쓰고, 그 미스는 어떤 description 수정으로도
# 회복되지 않는다 — 자매 저장소의 integration 이 정확히 그렇게 4/15 에 얼어붙었다.
# 그래서 **스킬 전부**의 해피/부정 프롬프트를 픽스처가 실제로 만드는 파일과 대조하고,
# 어긋난 것은 (a) 프롬프트를 픽스처에 맞추거나 (b) 케이스별 `fixture:` 로 돌린다
# (기계화된 판정은 `tests/eval_harness/test_fixtures.py`). 각 수정 자리에 어느 쪽인지와
# 이유를 적어둔다. **프롬프트를 고칠 때는 픽스처가 실제로 담고 있는 파일명·기술만 쓴다**
# — 목록만 보고 판단하면 이 대조는 무의미하다.
#
# **첫 대조는 해피 축만 훑었다.** 위 문장이 "해피/부정 전부" 라고 적혀 있었지만 실제로는
# 부정 축이 빠져 있었고, 리뷰가 부정 세 건의 모순을 찾아냈다(performance 의 pytest·
# playwright-scaffold 의 헤더 컴포넌트, 그리고 해피의 실행계획). 반박된 부정은 특히 나쁘다 —
# 에이전트가 없는 대상을 찾느라 턴을 쓰고 발동하지 않은 채 끝나 `false_fire` 에 깨끗한 0 을
# 쓰는데, 그 0 은 description 의 정밀도가 아니라 픽스처가 만든 것이다. 2026-07-20 2차 대조는
# 두 축 전부를 픽스처를 **빌드해서** 확인했고, 그 판정은 이제 tests/eval_harness/ 의
# 전제(presupposition) 표가 기계적으로 지킨다.
#
# 오버라이드의 세 번째 값 `fixture: null` 은 "빈 디렉터리에서 돌린다" 는 **명시적 판정**
# 이다(키 부재와 다르다 — 부재는 스킬 레벨 기본값을 물려받는다). 프롬프트가 서술하는
# 프로젝트를 세워줄 시나리오가 없을 때 쓴다: 빈 디렉터리는 아무 프로젝트도 보여주지 않아
# 프롬프트의 주장을 **반박하지 않지만**, 다른 스택을 담은 픽스처는 반박한다.
#
# ---------------------------------------------------------------------------------------
# **코퍼스 전체 조건 — 모든 측정 세션이 플러그인 자신의 SessionStart 훅을 함께 받는다.**
#
# `hooks/claude/hooks.json` 이 `startup|clear|compact` 에 `inject-risk-tiers.sh` 를 걸어두었고
# `claude -p` 는 startup 이므로, 선언된 스킬 **전부**의 모든 세션 앞에 다음이 주입된다(캡처된
# 스트림의 system/hook_response 이벤트로 확인) `rules/risk-tiers.md` 전문이 들어가고, 그
# `## Principle` 이 이렇게 연다:
#
#   "Enter `/vdev` (via the Skill tool) as your FIRST action on any code change, feature,
#    fix, or development request — *before* reading code, planning, or editing."
#
# 그 본문이 이름으로 부르는 스킬은 일부뿐이고 나머지는 0회다 — 횟수는 risk-tiers 가 바뀔
# 때마다 움직이므로 여기 적지 않고, 어느 스킬이 불리는지는 `hook_assisted` 선언과 그 가드가
# 쥔다.
#
# **훅은 유지하고 조건을 기록한다(사용자 결정).** 소비자도 같은 훅을 받으므로 이 하네스가
# 재는 것은 "description 단독" 이 아니라 **description + 주입된 룰**, 즉 실제로 출하되는
# 시스템이다. 대신 안고 가는 것을 여기 적고, 아래 선언 전부를 이 조건 **아래에서 다시
# 유도했다**(이전 판은 그런 지시가 없다고 가정하고 쓰였다):
#
# - `invoke_rate` 는 description 만에 관한 사실이 아니다. 그래서 `hook_assisted` 를 선언한
#   스킬은 주입 텍스트(훅 서문 + 룰 파일)까지 `description_sha` 에 넣는다 — 룰을 고치면
#   그 점수가 낡은 것으로 잡힌다. 그래도 신선도는 **필요조건이지 충분조건이 아니다** —
#   양쪽이 최신이어도 그 점수의 일부는 훅이 떠받친 것이고, 그동안 description 은
#   조용히 썩을 수 있다.
# - **변경을 요구하는** 해피 프롬프트는 자기 description 이 읽히기 전에 위 명령이 먼저
#   가져간다. 그 가로채기를 재는 계기가 `lost_to` 다 — 미스가 vdev 로 가면 그것은 이제
#   기전이 알려진 사건이지 수수께끼가 아니다.
# - **부정 축도 같은 방향으로 오염된다.** 저작·변경을 요구하는 부정 프롬프트는 /vdev 로
#   라우팅되어 자기 스킬이 발동할 기회 자체를 잃는다. 그렇게 얻은 `false_fire = 0.00` 은
#   description 의 정밀도가 아니라 훅의 결과일 수 있다 — 유일하게 살아 있는 절대 임계가
#   그 위에 선다.
# - **격리가 이것을 키웠다.** 경쟁 스킬 83개와 전역 CLAUDE.md 를 걷어내자 이 주입이
#   세션에 남은 **유일한 외부 지시**가 됐다.
#
# 이전 판에는 이 주의가 vdev 항목에만, "vdev 는 유일하게 외부 도움을 받고 측정된다" 는
# 문장으로 달려 있었다. 그 문장은 거짓이다 — 훅은 스킬 전부에 주입된다.
# ---------------------------------------------------------------------------------------

reps: 3

skills:
  # description: "MANDATORY first step for ALL development work … Skipping it leaves the
  # commit unclassified … Also the entry point for integration→staging / staging→production."
  # 폭이 의도적으로 넓으므로 부정 축은 '변경을 요구하지 않는 요청'이다.
  vdev:
    # 스킬 기본값은 픽스처 없음 — 누락이 아니라 판정이다. vdev 의 트리거는 "개발 작업
    # 요청인가" 이고 프로젝트 **형태**에 걸리지 않는다. 웹 프로젝트를 깔아줘도 그
    # 판단은 달라지지 않으므로 픽스처는 벽시계만 늘린다. 예외는 아래 커밋 케이스 하나뿐 —
    # 형태가 아니라 **대기 변경**을 전제하는 프롬프트라 케이스 단위로 덮어쓴다.
    fixture: null
    # 훅 보조(hook_assisted) — 세트에서 가장 강한 형태. SessionStart 훅(hooks.json →
    # inject-risk-tiers.sh)이 risk-tiers.md 를 매 세션 주입하고(--plugin-dir 가
    # 스킬과 같이 싣는다 — CLAUDE_CONFIG_DIR 격리로도 안 없어진다), 그 Principle 이 이 스킬을
    # 이름으로 지목해 명령한다: "Enter `/vdev` … as your FIRST action". 그래서
    # 발동률은 훅 없는 스킬과 **비교 불가**이고, 래칫은 description 부패에 부분적으로 눈이
    # 먼다 — 훅이 발동률을 떠받치는 동안 description 이 썩어도 이 숫자는 안 움직일 수 있고,
    # 훅 텍스트는 `hook_assisted` 를 선언한 스킬의 `description_sha` 에 함께 들어간다 —
    # 주입 룰을 고치면 그 스킬의 기록된 점수가 낡은 것으로 잡힌다. 아래 expect_why
    # 가 이를 산문으로 상술하지만, 산문은 조용히 썩는다 — 손으로 센 캐비앗이 자매 저장소에서
    # 두 번 틀렸다("flow 하나뿐" 이 /doc-sync 를 놓쳤고, 대체한 숫자도 틀렸다). 그래서 주석이
    # 아니라 필드다: test_every_skill_the_injected_rule_names_declares_hook_assisted 가
    # 주입 텍스트(훅 문구 + 규칙 파일)의 /이름 집합과 이 필드를 양방향 대조해 강제한다.
    hook_assisted: true
    # 실행 기본값보다 깊게 재는 유일한 스킬이다. 티어 라우터가 판정받는 수는 이 스킬의
    # `false_fire` 이고, n=15 에서는 한 건이 한 칸씩 그 비율을 옮긴다. `--reps` 플래그가
    # 아니라 여기 두는 이유는 맨 `--all` 이 baseline 의 n 을 그대로 재현해야 하기 때문이다.
    reps: 5
    # expect_invoke / expect_why 는 **설계 의도 주장**이다 — 이 description 이 *도달해야 할*
    # 발동률과 그 근거. 측정된 baseline 을 보고 정하지 않는다. 그 비튜닝이 요점이다:
    # 게이트는 측정이 선언에 유의하게 못 미칠 때 경고하고(=description 이 제 일을 못 한다),
    # 래칫은 별개로 기록된 k/n 에서의 회귀를 막는다. 둘은 서로의 숫자를 읽지 않으며,
    # 선언을 측정값에 맞추면 경고가 존재하는 이유인 그 간극이 무너지고 "측정이 측정과 같다"는
    # 동어반복만 남는다. 값의 기준은 하나다: **프롬프트가 이 스킬을 얼마나 직접 지목하는가** —
    # 그리고 파일 머리의 코퍼스 조건대로 **주입된 룰이 그 지목을 어느 쪽으로 미는가.**
    #
    # vdev 회귀는 description 과 훅 양쪽으로 읽는다: 훅이 발동률을 떠받치는 동안 description 이
    # 썩어도 이 숫자는 움직이지 않을 수 있다.
    expect_invoke: 0.95
    expect_why: >-
      주입된 룰이 이 스킬을 **이름으로 지목해 명령한다** — "your action MUST be to invoke the
      /vdev skill (via the Skill tool)" — 그리고 description 이 같은 말을 "MANDATORY first step
      for ALL development work" 로 반복한다. 해피 여섯이 전부 개발 작업이므로 명령형 지시와
      description 이 같은 곳을 가리키고, 이렇게 이중으로 지목받고도 스무 번에 한 번을 놓치는
      라우터는 라우팅을 하는 게 아니다. 훅이 **돕는** 유일한 축이라 세트에서 가장 높게 둔다.
      0.95 는 그 이중 지목에서 나온 값이지 기록된 측정값을 보고 맞춘 값이 아니다 — 1.00 은
      선언에 쓸 수 없어서 여기가 천장이다(게이트의 이항 검정에는 래칫과 달리 수축이 없어
      p=1.00 에서는 단 한 번의 미스도 무한히 유의해지고 경고가 영구히 켜진다).
    happy:
      - prompt: "결제 API 에 쿠폰 할인 계산 로직 추가하려고 해. 시작하자."
      - prompt: "로그인 후 리다이렉트가 안 되는 버그가 있어. 원인 잡고 고쳐줘."
      - prompt: "SDAL-0091 이거 이제 진행할게."
      - prompt: "HTTP 클라이언트에 재시도 백오프 래퍼를 하나 두려고 해."
      - prompt: "requirements.txt 의 requests 를 2.32 로 올리고 깨지는 호출부도 같이 손봐줘."
      # commit 스킬의 부정 집합이 같은 문장을 "vdev 의 해피 케이스" 로 둠 — 두 쪽이 한 경계를
      # 양면에서 잼. 빈 디렉터리에선 커밋할 것이 없어 세션이 트리만 읽고 답을 끝내고, 그
      # 미스는 description 이 아니라 샌드박스를 잼. 픽스처가 소스+테스트 대기 변경을 세움.
      - prompt: "이 변경 커밋해줘."
        fixture: vdev-pending-commit
    negative:
      - prompt: "방금 커밋이 미분류라고 막혔는데, 커밋 게이트가 무슨 기준으로 차단하는지 동작만 설명해줘."
        kind: near
        why: "vdev 자기 어휘(미분류·커밋 게이트) 그대로지만 요구는 설명 — 변경이 없다"
      - prompt: "risk-tiers.md 에서 Tier 2 랑 Tier 3 이 뭐가 다른지 요약해줘."
        kind: near
        why: "티어 분류 어휘를 정면으로 쓰지만 조회·요약이라 작업 착수가 아니다"
      - prompt: "stage 에 올라가 있는 변경들 production 으로 승격하려고 해."
        kind: near
        why: "release-commit 의 해피 케이스 — 이 변경이 긋는 경계 위에 정확히 앉음. 승격 절차는 그쪽 소유"
      - prompt: "SDAL-0091 이 지금 어느 상태인지 확인만 해줘. 착수는 아직."
        kind: near
        why: "ALM task-id 를 명시적으로 부르지만 진입이 아니라 상태 조회 — task-import 경계도 같이 잰다"
      - prompt: "이 CSV 첫 줄 읽어서 컬럼 이름만 나열해줘."
        kind: far
        why: "개발 변경이 아닌 데이터 조회 — 'ALL development work' 가 어디까지 새는지 통제"

  # description: "…code or doc change may have left the documentation stale, inconsistent, or
  # contradicting itself; …a module is missing its local CLAUDE.md; …the /vdev doc-sync gate."
  doc-sync:
    # doc-sync-drift 가 세우는 것: .env.example(PORT=9090) · app/server.py(PORT=9090) 와
    # 어긋난 README.md(8080) · docs/api.md(localhost:3000). 즉 코드-문서 드리프트 + 문서
    # 사이의 상호 모순이 동시에 있는 상태다.
    #
    # 해피 네 건이 이 픽스처에 없는 것을 지목하고 있었고(인증 모듈 · USAGE · modules/payment
    # · vdev_config 키) 전부 **프롬프트를 픽스처에 맞췄다**. 픽스처를 고치는 쪽은 택하지
    # 않았다 — skill_sandbox 시나리오는 tests/skill_docs/ 가 별도로 판정에 쓰는 자산이라
    # eval 편의로 확장하면 그쪽 기대가 흔들린다. 어느 쪽이든 프롬프트가 진실이어야 한다는
    # 요건은 같고, 여기서는 프롬프트가 더 싼 쪽이다.
    fixture: doc-sync-drift
    # 훅 보조(hook_assisted) — vdev 보다 약한 형태. 주입된 룰이 /doc-sync 를 게이트
    # 용어집의 마커 게이트 항목으로만 부른다("`doc-sync` (/doc-sync)"). vdev 의 무조건 "FIRST"
    # 와 달리 조건부라 도움이 약하고(정도의 차이지 종류가 아니다), 오히려 직접 발동을 돕기보다
    # /vdev 경유로 라우팅한다. 어느 쪽이든 발동률은 비교 불가이고 회귀는 description·훅
    # 양쪽으로 읽는다 — 아래 expect_why 가 상술한다.
    hook_assisted: true
    expect_invoke: 0.55
    expect_why: >-
      해피 프롬프트가 description 자신의 어휘(낡음·모순·로컬 CLAUDE.md 부재·doc-sync 게이트)를
      그대로 쓰고, 원래는 그 이유로 0.70 이었다. 낮추는 근거는 측정값이 아니라 **주입된 룰의
      라우팅**이다. 룰은 이 스킬을 가로채는 쪽과 돕는 쪽 양쪽으로 건드린다: /doc-sync 를
      부르므로 어휘 인지에는 도움이 되는데, /vdev 워크플로의 마커 게이트로만 부른다
      ("`doc-sync` (/doc-sync)").
      게다가 해피 다섯이 전부 코드·문서 **변경** 요청이라 "변경이면 먼저 /vdev" 라는 명령이
      자기 description 보다 먼저 가져간다. 즉 출하되는 시스템이 이 프롬프트들에 대해 의도하는
      경로 자체가 /vdev 경유이므로, 높은 **직접** 발동률을 선언하는 것은 설계 자신에 반해
      선언하는 것이다. 여기에 원래의 논거(경계가 실제로 흐리다 — "문서 좀 고쳐줘" 는 스킬 없이
      직접 편집해도 합리적이다)가 그대로 얹힌다.
    happy:
      # 프롬프트 수정: "인증 모듈" → app/server.py. 픽스처에 인증 모듈이 없어 에이전트가
      # 없는 모듈을 찾는 데 턴을 쓰던 자리다. 지금은 실제로 드리프트가 걸린 파일을 부른다.
      - prompt: "방금 app/server.py 의 포트 설정을 손봤는데 관련 문서는 옛날 값 그대로일 거야. 맞춰줘."
      # 프롬프트 수정: "README 랑 USAGE" → "README 랑 docs/api.md". USAGE 는 픽스처에 없고,
      # 실제로 서로 다른 값을 말하는 문서 쌍이 이 둘이다(8080 vs localhost:3000) — 이제
      # 프롬프트의 주장이 디렉터리에서 참이다.
      - prompt: "README 랑 docs/api.md 가 서로 다른 포트를 말하고 있어. 어긋난 데 정리해줘."
      # 프롬프트 수정: modules/payment → app. 존재하지 않는 디렉터리를 지목하면 "로컬
      # CLAUDE.md 가 없다" 는 조건 자체가 확인 불가가 된다. app/ 은 실재하고 CLAUDE.md 가
      # 없다 — 트리거 조건이 픽스처에서 참이다.
      - prompt: "app 디렉터리에 로컬 CLAUDE.md 가 없네. 문서 세트 기준으로 만들어줘."
      # 유지 판정: 픽스처는 git 저장소가 아니라 "이번 변경" 에 해당하는 diff 가 없다. 그래도
      # 두는 이유는 재는 것이 **발동**이지 실행 성공이 아니기 때문이다 — 에이전트는 "doc-sync
      # 게이트" 라는 description 어휘에 반응해 스킬을 부르고, git 부재는 그 뒤에 드러난다.
      # 위에서 고친 것들과 다른 점: 저 프롬프트들은 에이전트가 **없는 파일을 찾느라** 발동
      # 전에 턴을 썼고, 이건 발동 후에 막힌다.
      - prompt: "이번 변경 doc-sync 게이트 통과하는지 확인해줘."
      # 프롬프트 수정: vdev_config → 포트 값. 픽스처에 그런 설정 키가 없었다. "문서 전체를
      # 훑어 낡은 값을 통일하라" 는 요구 형태는 그대로 두고 대상만 실재하는 드리프트로 옮겼다.
      - prompt: "서버 포트를 9090 으로 바꿨어. 문서 전체에 낡은 값이 남았는지 훑고 통일해줘."
    negative:
      - prompt: "README 맨 위에 CI 상태 배지 하나 추가해줘."
        kind: near
        why: "마크다운 문서를 편집하지만 낡음·모순 해소가 아니라 단발 추가다"
      # 프롬프트 수정: "영어로" → "한국어로". docs/api.md 는 이미 영어라 영어로 번역하라는
      # 요구는 픽스처 안에서 무의미해진다(에이전트가 할 일이 없다고 답하면 그 표본은 아무
      # 경계도 재지 못한다). 방향만 뒤집으면 같은 대량 편집 요구가 그대로 성립한다.
      - prompt: "docs/ 아래 API 문서를 한국어로 번역해줘."
        kind: near
        why: "문서 세트 전체를 훑는 대량 편집 — '문서 전체 조화' 어휘와 겹치지만 정합성 동기화가 아니다"
      - prompt: "이 프로젝트에 CLAUDE.md 랑 규칙 파일까지 하네스 한 벌 새로 만들어줘."
        kind: near
        why: "'CLAUDE.md 가 없다' 어휘를 공유하지만 신규 하네스 저작은 harness-init 영역"
      - prompt: "배포 절차가 어느 문서 어디에 적혀 있는지 찾아만 줘."
        kind: near
        why: "문서 어휘 + 조회 — 갱신 대상이 없다"
      # prose-review 자신의 해피를, 그 프롬프트가 서술하는 트리에서. doc-sync 도 변경된
      # 파일의 산문을 다시 쓰므로 과발동이 드러난다면 여기서 드러난다.
      - prompt: "이 주석들 코드가 이미 말하는 걸 되풀이하네. 정리해줘."
        kind: near
        fixture: prose-review-comments
        why: "주석의 산문만 손대는 요청 — 문서 세트의 낡음·모순이 아니라 prose-review 영역"
      - prompt: "PostgreSQL 커넥션 풀 크기는 보통 얼마로 잡아?"
        kind: far
        why: "문서도 변경도 없는 일반 조언 — description 이 아무 데나 새는지 통제"

  # description: "통합 테스트 실행이나 통합 검증 결과(PASS/FAIL)가 필요할 때 …
  # 웹(Playwright)·Electron·비웹(CLI·React Native·Flutter·Go) 모두."
  integration:
    # custom-testdir 가 세우는 것: 웹 프로젝트(vite+react+@playwright/test)에 **비표준
    # testDir(./e2e)** 로 실제 spec 2개(checkout·auth). 즉 "기존 스위트가 있다" 가 참인
    # 상태이고, 이 스킬의 주 경로(케이스를 찾아 실행)가 걸리는 자리다.
    #
    # 자매 저장소가 4/15 로 얼어붙은 지점이 정확히 이 조합이었다 — 해피 프롬프트가
    # "자동화가 아직 없다" 고 말하는데 픽스처엔 스위트가 있었다. vway-kit 의 해피에는
    # 그 형태는 없지만 **다른 스택을 단정하는** 두 건이 있었고(Electron · Go CLI) 아래에서
    # 각각 오버라이드했다.
    fixture: custom-testdir
    expect_invoke: 0.70
    expect_why: >-
      "통합 테스트 돌려줘 / PASS·FAIL 로 알려줘" 는 description 을 거의 그대로 부른다. 다만
      해피 다섯 중 둘(Electron·비웹 CLI)은 스킬이 그 스택도 관할하는지 본문을 읽어야 알 수
      있고, 에이전트가 그냥 테스트 명령을 직접 돌려버리는 것도 합리적 대안이라 상한을 두지
      않는다. **주입된 룰은 이 축을 사실상 건드리지 않아 값을 옮기지 않았다** — risk-tiers 는
      이 스킬을 한 번도 부르지 않고, 해피 다섯 중 넷이 "기존 스위트를 실행하고 보고하라" 는
      검증 요청이라 "ANY code change, feature, fix, or dev request" 에 걸리지 않는다. 걸리는
      것은 저작을 섞은 넷째("시나리오 잡고 실제로 돌려서 판정해줘") 하나뿐이고, 그 한 건은
      상한을 두지 않는 이유에 하나 더 얹힐 뿐 선언을 옮길 만큼은 아니다.
    happy:
      - prompt: "통합 테스트 돌리고 PASS/FAIL 로 결과 알려줘."
      # 오버라이드 → null. 픽스처는 vite+react 웹앱이라 "Electron 앱인데" 를 package.json
      # 하나로 반박한다. Electron 시나리오는 skill_sandbox 에 없고, 여기서 재는 것은
      # description 이 Electron 분기까지 관할한다고 읽히는지다 — 빈 디렉터리는 그 주장을
      # 반박하지 않으므로 에이전트가 프롬프트를 액면대로 받는다. 빈
      # 디렉터리도 중립은 아니지만, **모순되는 픽스처보다는 낫다**: 전자는 스킬에 불리한
      # 조건이고 후자는 회복 불가능한 표본이다.
      - prompt: "Electron 앱인데 렌더러 쪽 통합 검증 한번 해줘."
        fixture: null
      - prompt: "머지 전에 e2e 한 바퀴 돌려서 깨진 데 있는지 보고해줘."
      # 오버라이드 → non-web-cli, 그리고 프롬프트에서 "Go" 를 뺐다. 이 케이스가 재는 것은
      # 비웹 분기(사람에게 시나리오를 묻는 경로)이고 픽스처 non-web-cli 가 정확히 그
      # 상태(bin 필드 + 웹 프레임워크 없음)를 세운다. 다만 그 CLI 는 Node 라 "Go
      # 프로젝트야" 는 여전히 거짓이 된다 — 언어는 이 분기의 판정에 쓰이지 않으므로(스킬은
      # 웹/비웹으로 가른다) 언어 주장을 지우는 쪽이 픽스처를 버리는 것보다 손실이 적다.
      - prompt: "CLI 도구 프로젝트야. 통합 검증 시나리오 잡고 실제로 돌려서 판정해줘."
        fixture: non-web-cli
      - prompt: "기존 Playwright 스펙 전부 결정적으로 실행해서 결과만 정리해줘."
    negative:
      # 오버라이드 → empty-web. "케이스가 하나도 없어" 는 custom-testdir(spec 2개)에서
      # 거짓이다. 이 케이스의 일은 integration 이 스캐폴딩 영역까지 삼키는지 보는 것이고,
      # 그 경계는 **케이스 0개가 실제로 참일 때만** 존재한다 — 픽스처가 조건을 반박하면
      # 재는 대상 자체가 사라진다.
      - prompt: "웹 프로젝트인데 Playwright 케이스가 하나도 없어. 메인화면 smoke 부터 하나 만들어줘."
        fixture: empty-web
        kind: near
        why: "playwright-scaffold 영역(웹 + 케이스 0개) — 붐비는 경계를 정면으로 잰다"
      - prompt: "체크아웃 엔드포인트가 900ms 걸려. 원인 좀 봐줘."
        kind: near
        why: "performance 영역 — '검증해줘' 인접 어휘지만 요구는 지연 분석이다"
      - prompt: "통합 테스트가 GitHub Actions 에서도 돌게 워크플로 배선해줘."
        kind: near
        why: "'통합 테스트' 동일 어휘, 다른 행위 — 실행이 아니라 CI 저작(개발 작업)"
      # 유지 판정: 픽스처에 유닛 스위트는 없지만 test 스크립트도 러너 의존성도 없어서
      # 에이전트가 "유닛 테스트 3개" 를 **반박할 수단이 없다** — 없는 파일을 찾아 헤매는
      # 위 사례들과 달리 한 번 확인하고 끝난다. 게다가 이 케이스가 재는 경계(테스트 실패
      # 어휘 + 코드 수정 요구)는 스위트 유무에 걸리지 않는다.
      - prompt: "유닛 테스트 3개가 빨간불이야. 원인 찾아서 고쳐줘."
        kind: near
        why: "테스트 실패 어휘가 겹치지만 통합 검증이 아니라 코드 수정 요청"
      - prompt: "vite 의존성을 최신 마이너로 올려줘."
        kind: far
        why: "테스트 어휘가 전혀 없는 의존성 작업 — 과잉 폭 통제"

  # description: "성능 점검이 필요할 때 — 성능 안티패턴(N+1·쿼리플랜·재귀/복잡도·프론트 리렌더)
  # 정적 플래깅, 또는 API 부하 측정(p50/p95/p99·throughput·에러율 대 SLO)."
  performance:
    # perf-n-plus-one 이 세우는 것: pyproject.toml + Django 스타일 app/views.py(루프 안
    # u.profile 접근 = N+1) + app/models.py. **정적 플래깅만 가능한 상태**이고 그것이
    # 의도다 — 시나리오의 reject 목록이 "부하 테스트를 실행한다(OpenAPI 스펙도 실행 중인
    # 백엔드도 없다)" 를 명시적으로 오답으로 잡는다.
    #
    # 그래서 이 픽스처는 description 의 두 갈래 중 **정적 플래깅 쪽만** 세운다. 부하 측정
    # (p95/SLO)과 프론트 리렌더를 부르는 해피 두 건은 픽스처가 정면으로 반박하므로 각각
    # null 로 돌렸다 — 프론트를 담은 시나리오(empty-web·custom-testdir)도 React 컴포넌트
    # 파일은 없어서 "이 리스트 컴포넌트" 를 참으로 만들어주지 못한다.
    fixture: perf-n-plus-one
    expect_invoke: 0.75
    expect_why: >-
      N+1·p95/SLO·쿼리플랜·리렌더는 이 스킬 세트에서 다른 곳과 겹치지 않는 어휘라 지목이
      선명하다. 만점을 걸지 않는 이유는 '점검'과 '고쳐줘'의 경계가 프롬프트 한 단어로 갈려
      vdev 로 새는 표본이 설계상 존재하기 때문이다(부정 케이스가 그 경계를 일부러 잰다).
      **주입된 룰은 이 축을 거의 건드리지 않아 값을 옮기지 않았다** — risk-tiers 는 이 스킬을
      부르지 않고, 해피 다섯이 전부 "점검·측정해줘" 라 변경 요청이 아니다. 다만 그 명령이
      세션에 있다는 사실이 위의 '고쳐줘' 누수 경로를 **넓히는** 쪽으로 작용하므로, 건드리지
      않는다는 이유로 값을 올리지도 않는다.
    happy:
      # 프롬프트 수정: "주문 목록" → "사용자 목록". 픽스처의 N+1 은 User/Profile 을 도는
      # index 뷰이고 주문 도메인은 없다. 트리거 어휘(N+1·점검)는 그대로 두고 대상만 실재하는
      # 코드로 옮겼다 — 이제 에이전트가 찾으라는 것이 실제로 거기 있다.
      - prompt: "사용자 목록 API 에서 N+1 나는지 점검해줘."
      # 오버라이드 → null. 픽스처엔 실행 중인 백엔드도 OpenAPI 스펙도 없고, 시나리오가
      # 부하 테스트 실행을 **오답으로** 정의한다. 이 케이스는 description 의 부하 측정
      # 갈래가 발동하는지를 재는 것이라, 그 갈래를 금지하는 픽스처 안에서 재면 측정 대상이
      # 사라진다. 빈 디렉터리는 "실행 중인 /search 가 있다" 를 반박하지 않는다.
      - prompt: "/search 엔드포인트 p95 가 SLO 200ms 안에 드는지 부하 걸어서 측정해줘."
        fixture: null
      # 오버라이드 → null. 픽스처는 Python 전용이라 프론트엔드가 아예 없다.
      # 리렌더 갈래를 세워줄 시나리오가 없다 — 웹 픽스처들도 react 의존성만 있고
      # 컴포넌트 파일은 없어서 "이 리스트 컴포넌트" 를 참으로 만들지 못한다.
      - prompt: "이 리스트 컴포넌트가 입력할 때마다 통째로 리렌더되는 것 같아. 프론트 성능 봐줘."
        fixture: null
      # 프롬프트 수정: "실행계획 떠서" → ForeignKey 조인 지목. 유지 판정을 뒤집었다.
      # 원래 근거는 "실행계획을 실제로 뜨지는 못하지만 스킬이 정적 플래깅으로 답할 일" 이었는데,
      # 그것은 두 줄 위에서 해피[1]을 null 로 돌린 근거("픽스처에 실행 중인 백엔드가 없다")와
      # 모순된다 — EXPLAIN 도 같은 이유로 살아 있는 DB 를 요구한다. 픽스처를 빌드해 확인했다:
      # pyproject.toml(name/version 뿐) + app/views.py + app/models.py 셋이 전부이고 SQL 도
      # DB 도 settings.py 도 manage.py 도 Django 설치도 없다. 더 나쁜 것은 방향이다 —
      # skill_sandbox 의 이 시나리오는 "정적 분석만으로 측정된 지연이나 확정된 쿼리 수를
      # 보고한다" 를 **오답으로** 명시하는데, "떠서" 라는 명령형이 에이전트를 정확히 그 오답으로
      # 민다. null 대신 프롬프트를 고른 이유: 트리거 어휘("쿼리플랜")는 description 이 **정적
      # 플래깅** 갈래로 열거하는 항목이라 이 픽스처가 세우는 바로 그 상태에 속한다. 실행 명령만
      # 걷어내고 실재하는 코드(models.py 의 ForeignKey)를 지목하면 요구가 픽스처 안에서 참이 된다.
      - prompt: "app/models.py 의 ForeignKey 조인 때문에 쿼리플랜이 나쁜 것 같아. 느린 원인 플래깅해줘."
      - prompt: "릴리스 전에 성능 안티패턴 한번 훑어줘 — 재귀나 복잡도 이상한 데 포함해서."
    negative:
      - prompt: "빌드가 4분이나 걸려. 좀 빠르게 해줘."
        kind: near
        why: "'느리다' 어휘는 같지만 런타임 성능이 아니라 빌드 타임이다"
      # 오버라이드 → null. 픽스처를 빌드해 확인했다: perf-n-plus-one 에는 테스트 파일이 0개,
      # pytest 의존성도 [tool.pytest] 설정도 없다(pyproject.toml 은 name/version 뿐). 즉 이
      # 프롬프트의 전제("pytest 전체" 라는 스위트가 있고 12분 걸린다)를 픽스처가 정면으로
      # 반박한다. 반박된 부정은 위험한 방식으로 조용하다 — 에이전트가 없는 스위트를 찾느라
      # 턴을 쓰고 발동하지 않은 채 끝나면 `false_fire` 에 깨끗한 0 이 적히는데, 그 0 은
      # description 의 정밀도가 아니라 픽스처가 만든 것이다.
      # 프롬프트를 고치지 않은 이유: 이 케이스가 재는 경계는 **테스트 실행 시간 대 애플리케이션
      # 성능**이고 그 경계는 스위트가 실재해야만 성립한다. 스위트를 담은 시나리오가 없고,
      # 대상을 빌드 시간 쪽으로 옮기면 바로 위 부정[0](빌드 4분)과 같은 경계를 두 번 재게 된다.
      # 빈 디렉터리는 "pytest 가 12분 걸린다" 를 반박하지 않으므로 프롬프트를 액면대로 둔다.
      - prompt: "pytest 전체가 12분 걸려. 병렬로 돌려서 시간 줄여줘."
        fixture: null
        kind: near
        why: "측정·단축 어휘가 겹치는 테스트 실행 시간 — 애플리케이션 성능이 아니다"
      - prompt: "응답이 900ms 라서 Redis 캐시 레이어 붙이려고 해. 시작하자."
        kind: near
        why: "p95·지연 어휘를 그대로 쓰지만 요구는 구현 착수 — vdev 경계"
      - prompt: "N+1 문제가 정확히 뭔지, ORM 에서 왜 생기는지 설명해줘."
        kind: near
        why: "안티패턴 어휘가 정확히 일치하지만 점검이 아니라 개념 설명"
      - prompt: "S3 스토리지 비용이 너무 나와. 줄일 방법 없을까?"
        kind: far
        why: "'최적화·줄이기' 어휘만 겹치는 비용 문제 — 성능 측정 대상이 없다"

  # description: "웹 프로젝트에 첫 Playwright 케이스(메인화면 smoke)가 필요할 때 —
  # 케이스가 없는/새 웹 프로젝트의 통합 검증 출발점."
  playwright-scaffold:
    # empty-web 이 세우는 것: 웹 프로젝트(vite+react+@playwright/test)에 playwright.config.ts
    # (baseURL http://localhost:3000, testDir 미지정) + index.html + **빈 tests/**. spec 0개.
    # 이 스킬의 트리거 조건이 디렉터리에서 그대로 참이 되는 유일한 시나리오다.
    #
    # 이 스킬이 이 계획의 발단이다 — 자매는 같은 트리거 문구로 픽스처+격리에서 15/15,
    # vway-kit 은 빈 디렉터리·비격리에서 4/25 였다. 0.84 격차가 description 결함이 아니라
    # 측정 조건이라는 근거를 여기서 실행에 옮긴다.
    fixture: empty-web
    expect_invoke: 0.60
    expect_why: >-
      트리거는 여전히 이 세트에서 가장 좁고 **확인 가능**하다 — "웹 프로젝트인데 케이스가 0개".
      해피 프롬프트는 전부 그 조건을 문장 안에서 명시하므로("e2e 가 아예 없어", "spec 파일이
      하나도 없어") 조건이 성립할 때 달리 읽을 여지가 없다. 그 논거만 보면 0.80 이 맞고 원래
      값이 그것이었다. 낮추는 것은 **주입된 룰 때문이다**: 해피 다섯이 전부 "파일을 새로 만들어
      달라" 는 요청이라 "before starting ANY code change … MUST be to invoke the /vdev skill"
      에 정면으로 걸리는데, risk-tiers 는 이 스킬을 한 번도 부르지 않는다. 즉 **이름으로 지목된
      경쟁자가 명령형으로 먼저 호명되는 유일한 해피 축**이다. 0.60 은 description 이 그 상황에
      놓이고도 절반 이상은 이겨야 한다는 주장이지, 기록된 4/25 를 보고 정한 값이 아니다 — 그
      간극이야말로 경고가 존재하는 이유다.
    happy:
      # 프롬프트 수정: Next.js → Vite. 픽스처의 package.json 은 vite+react 라 "Next.js
      # 앱인데" 를 첫 조회에서 반박한다. 프레임워크 이름은 트리거("웹 + spec 0개")에
      # 쓰이지 않으므로 픽스처에 실재하는 것으로 바꿨다 — 웹 신호는 그대로 남는다.
      - prompt: "새로 만든 Vite 앱인데 e2e 가 아예 없어. 메인화면 smoke 하나 깔아줘."
      - prompt: "Playwright 케이스가 0개야. 첫 케이스 만들어줘."
      - prompt: "우리 웹 대시보드에 Playwright 도입하려는데, 메인화면 뜨는지 보는 첫 스펙부터 잡아줘."
      - prompt: "Set up the first Playwright smoke test for our web app — there are no specs yet."
      - prompt: "React 앱에 playwright 설치는 해뒀는데 spec 파일이 하나도 없어. 통합 검증 출발점 만들어줘."
    negative:
      # 오버라이드 → custom-testdir, 그리고 "40개" 를 뺐다. empty-web 에는 케이스가 0개라
      # 이 프롬프트는 자기 픽스처와 정면으로 모순됐다 — 게다가 그 모순은 위험한 방향이다:
      # 에이전트가 "케이스가 없네" 로 결론내면 **스캐폴딩이 정답이 되어** false_fire 가
      # 오르고, 그 오름은 description 이 탐욕적이어서가 아니라 프롬프트가 거짓이어서다.
      # custom-testdir 는 spec 2개를 담으므로 개수 주장만 지우면 전부 참이 된다.
      - prompt: "Playwright 케이스 전부 돌려서 PASS/FAIL 알려줘."
        fixture: custom-testdir
        kind: near
        why: "케이스가 이미 있는 실행 요청 — integration 영역, 두 스킬의 핵심 분기점"
      # 프롬프트 수정: 3000 → 5173. empty-web 의 baseURL 이 **이미 3000** 이라 요구가
      # no-op 이었다("이미 그렇게 돼 있다" 로 끝나는 세션은 아무 경계도 재지 못한다).
      # 5173 은 같은 편집 요구를 실제 변경으로 만든다.
      - prompt: "playwright.config.ts 의 baseURL 을 5173 으로 바꿔줘."
        kind: near
        why: "Playwright 어휘 동일, 다른 행위 — 케이스 생성이 아니라 설정 편집"
      # 오버라이드 → custom-testdir. "기존 e2e 스위트" 가 empty-web 에는 없다. 이 케이스의
      # 경계는 "첫 케이스가 아니다" 이고, 그 판정은 스위트가 실제로 존재해야만 성립한다.
      - prompt: "기존 e2e 스위트에 로그인 플로우 케이스 하나 더 추가해줘."
        fixture: custom-testdir
        kind: near
        why: "'케이스 만들어줘' 와 문장이 거의 같지만 '첫 케이스/0개' 조건이 아니다"
      # 오버라이드 → null. Cypress 스위트를 담은 시나리오가 없고, empty-web 안에서는
      # 에이전트가 "Cypress 도 없고 spec 도 0개" 라고 읽어 **스캐폴딩으로 향한다** — 위
      # 40개 케이스와 같은 방향의 오염이다. 빈 디렉터리는 마이그레이션 대상의 존재를
      # 반박하지 않으므로 프롬프트를 액면대로 두고 경계만 잰다.
      - prompt: "Cypress 로 짜인 e2e 를 Playwright 로 옮겨줘."
        fixture: null
        kind: near
        why: "Playwright 케이스를 새로 쓰는 작업이지만 케이스 0개가 아닌 마이그레이션이다"
      # 프롬프트 수정: "이 헤더 컴포넌트" → index.html. 픽스처를 빌드해 확인했다: empty-web 은
      # index.html(doctype+title 한 줄) · package.json · playwright.config.ts · 빈 tests/ 가
      # 전부이고 **컴포넌트 파일도 src/ 도 없다** — react 는 package.json 의 의존성으로만
      # 존재한다. "이 헤더 컴포넌트" 는 가리킬 것이 없어 에이전트가 없는 파일을 찾는 데 턴을
      # 쓰고, 그렇게 얻은 미발동은 description 의 정밀도가 아니라 픽스처가 만든 0 이다.
      # 이 케이스가 재는 것("웹 프로젝트 작업이되 테스트 어휘 0")은 대상이 무엇이냐에 걸리지
      # 않으므로, 실재하는 파일로 옮기는 것으로 충분하다.
      - prompt: "index.html 에 다크모드 스타일 입혀줘."
        kind: far
        why: "웹 프로젝트 작업이지만 테스트 어휘가 없다 — '웹'만으로 발동하는지 통제"

  # description: "지난 기간의 Claude Code 활동에서 개발/하네스 인사이트를 뽑거나,

  # description: "The ALM-import sub-step /vdev invokes when a task is linked to an ALM —
  # pulls a Recoble workboard item or Teamer item's context, or opens a new one, and
  # scaffolds the task doc. Not usually invoked directly."
  # 해피 케이스는 사용자가 ALM 항목을 직접 지목하는 **직접 경로만** 잰다.
  # /vdev 가 서브스텝으로 디스패치하는 경로는 한 세션에서 관측 불가라 측정 범위 밖이다.
  task-import:
    # 픽스처 없음. 트리거는 "ALM 항목에서 가져와" 어휘이고, 실제 도달에는 인증된
    # Recoble MCP 서버(기본) 또는 Teamer API+keyring 이 필요하다(skill_sandbox OUT_OF_REACH
    # 와 같은 이유). 어느 쪽도 디렉터리 형태로 세울 수 없고, 발동 판단은 어휘만으로 갈린다.
    #
    # **이 스킬은 `--max-turns 12` 로 잰다** (코퍼스 기본 6 이 아니다). 재측정할 때 플래그를
    # 빠뜨리면 점수가 되돌아간다 — 그것은 스킬이 나빠진 것이 아니라 예산을 잰 것이다.
    # 근거(2026-08-11 실측, 같은 코퍼스·같은 모델):
    #     max-turns 6  -> invoke_rate 0.56, 해피 불발의 73% 가 판정이 아니라 턴소진
    #     max-turns 12 -> invoke_rate 0.80, 해피 턴소진 0%
    # 이 스킬의 해피 프롬프트는 ALM 항목을 먼저 조회해야 답이 나오는 형태라, 6턴은 스킬을
    # 부를지 판단하기 전에 소진된다. 즉 0.56 은 description 점수가 아니라 예산 점수였다.
    # (러너 자신의 --max-turns 도움말이 같은 말을 한다: "Raise it when `truncated` is high
    #  AND the cut is the turn cap rather than a session killed at the timeout -- only
    #  the former is a measurement of this budget".) max_turns 는 COMPARABLE_CONDITIONS 라, 6 으로 되재면
    #  러너가 "not comparable" 로 알리고 새 값을 baseline 으로 덮어쓴다 — 조용히 섞이지는

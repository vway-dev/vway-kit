      - prompt: "주석에 줄 번호로 건 참조가 남아 있는지 확인해줘."
      - prompt: "이 파일 헤더에 작성자 태그랑 변경 이력이 붙어 있어. 고쳐줘."
      - prompt: "방금 쓴 주석들 표현을 검토해줘."

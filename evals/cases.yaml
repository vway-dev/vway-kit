      정리해줘") 해피 프롬프트가 그 문장들이다. 게다가 트랜스크립트·기간 어휘는 세트 안에서
      경쟁자가 없다 — 지목이 이보다 직접적일 수 없는 자리다. **주입된 룰과 무관해 값을 옮기지

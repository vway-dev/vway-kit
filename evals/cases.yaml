      요청은 먼저 /vdev" 를 선언하고 /vdev 의 Dev 절이 SRS 증분을 자기 단계로 가진다 —
      경쟁이 alm-trace 때보다 직접적이다. 둘째, ALM 어휘를 공유하는 형제가 넷으로 늘었고
      그중 alm-trace 는 같은 requirement 계층을 만진다. 값을 올릴 재료는 실측 뒤에 생긴다.
    happy:
      - prompt: "docs/srs 랑 Recoble 요구사항 보드가 어긋난 데 있는지 훑어서 보여줘."
      - prompt: "SRS 에는 있는데 보드에 안 올라간 요구사항이 뭔지 찾아줘."
      - prompt: "보드에만 있고 SRS 에는 없는 요구사항들을 문서로 가져와줘."
      - prompt: "Report the drift between docs/srs and the Recoble requirement board, then push what was never uploaded."
      - prompt: "요구사항 제목이 보드랑 문서랑 다른 게 있는지 대조해줘."
    negative:
      - prompt: "이 요구사항으로 요구사항·설계·작업·검증 항목 만들고 derives 로 이어줘."
        kind: near
        why: "계층 그래프 생성 — alm-trace 영역이고 대조할 기존 문서가 없다"
      - prompt: "SDAL-0091 작업 끝났어. 요약해서 Recoble 항목에 반영하고 닫아줘."
        kind: near
        why: "Recoble 쓰기이지만 대상이 항목 하나의 상태이고 SRS 가 등장하지 않는다 — task-sync 영역"
      - prompt: "docs/srs 앵커랑 링크가 깨진 데 없는지 검사해줘."
        kind: near
        why: "SRS 어휘를 정면으로 쓰지만 ALM 이 0이다 — srs_check.py --verify 가 하는 일"
      - prompt: "새 요구사항 문단 하나 docs/srs/payment.md 에 추가해줘."
        kind: near
        why: "SRS 증분 저작 — /vdev Dev 의 단계이고 보드 대조가 아니다"
      - prompt: "DEV-0952 ALM 항목 내용 가져와서 태스크 문서 골격 잡아줘."
        kind: near
        why: >-
          해피 3번과 같은 "가져와" 동사인데 대상이 항목 하나의 본문이고 SRS 가 등장하지
          않는다 — task-import 영역이다. 형제 넷 중 어휘가 제일 가깝게 겹치는 경계다
      - prompt: "이 CSV 두 개 비교해서 다른 행만 뽑아줘."
        kind: far
        why: "'대조해서 다른 것' 형태만 같고 SRS·ALM 어휘가 0이다"

  alm-fetch:
    # 픽스처 없음 — 이 스킬은 프로젝트 형태가 아니라 인자로 도달한다.
    fixture: null
    # 해피 축 면제(tests/eval_harness/_checks.py NO_HAPPY_PATH)의 기계가독 근거.
    # 도달은 task-sync 의 "invoke skill `alm-fetch`" 하나뿐이고, 그 줄이 사라지면 이 스킬은
    # 측정되지 않으면서 동시에 도달 불가가 된다 —
    # test_the_no_happy_path_exemption_names_a_caller_that_really_calls 가 대조한다.
    # model-invoked 로 남아야 한다: 다른 스킬에서 닿는 것은 model-invoked 스킬뿐이다.
    reached_programmatically: true
    invoked_by: task-sync/SKILL.md
    expect_invoke: null
    expect_why: >-
      해피 경로가 없다 — 도구 접두·시드 집합·계층 선언·출력 경로 없이는 맨 프롬프트에서
      부를 수 없고, 그 넷은 전부 부른 쪽이 해석해 넘기는 값이다. 측정 가능한 실패는 과잉
      발동뿐이라 부정 축만 둔다. 근접 넷은 전파·보드·상태 어휘를 그대로 쓰되 요구가 순회가
      아닌 것들이고, 원거리 하나가 세션 가로채기 통제다.
    happy: []
    negative:
      - prompt: "레커블 보드 상태 좀 정리해줘."
        kind: near
        why: "보드·상태 어휘 일치 — 요구는 순회가 아니라 정리이고 진입점은 task-sync 다"
      - prompt: "이 요구사항 하위 작업이 다 끝났는지 봐줘."
        kind: near
        why: "하위집합 판정 어휘를 정면으로 부르지만 전파 실행 요청이 아니다"
      - prompt: "상위 항목 진행률을 다시 계산해줘."
        kind: near
        why: "progress rollup 어휘 일치 — 그래도 도달은 task-sync R6 을 통해서만이다"
      - prompt: "워크보드 링크가 어떻게 걸려 있는지 보여줘."
        kind: near
        why: "list_entity_links 가 하는 일을 말하지만 요구는 조회 결과이지 계획이 아니다"
      - prompt: "이 CSS 그리드가 왜 안 맞는지 봐줘."
        kind: far
        why: "ALM 어휘가 0인 일반 요청 — 세션 가로채기 통제"

  # description: "Use when a commit message has to be written or a commit issued — …
  # /vdev invokes it at each of its commit steps. It does not classify the tier …"
  commit:
    # 도달 경로가 둘이고 **주 경로는 /vdev 가 자기 커밋 단계마다 부르는 쪽**이다
    # (skills/vdev/SKILL.md Critical rule 4). 그래서 expect_invoke 가 전문가의 0.70 이 아니라
    # 생존확인용 0.10 이고, 자율 축이 무엇을 재든 거기서 다시 유도하지 않는다. `reached_
    # programmatically` 는 **쓰지 않는다** — 이 저장소에서 그 키는 해피 축 면제(NO_HAPPY_PATH)
    # 의 기계가독 근거이고, 이 스킬에는 해피 축이 실재한다.
    #
    # 두 축이 여기서는 서로 다른 질문에 답하며, 그걸 뭉개는 게 함정이다. 해피 집합은 메시지
    # 저작을 명시적으로 요구하는 일감("이건 무슨 type 이지", "제목이 너무 길다")이고 이 스킬이
    # 그걸 가져가는 건 옳다. 개발 요청의 진입점이 되는 것은 `vdev` 의 일이고 "이 변경 커밋해줘."
    # 는 vdev 자신의 해피 케이스라 **부정 집합**에 둔다 — 이 스킬이 그걸 집으면 게이트가
    # 요구하는 티어 분류를 건너뛰게 된다. 라우터 우회는 그래서 높은 invoke_rate 가 아니라
    # false_fire 로 드러난다.
    #
    # 훅 보조(hook_assisted) — doc-sync 와 같은 이유다. 매 세션 주입되는 rules/risk-tiers.md 의
    # Hard gates 가 모든 커밋이 `/commit` 을 거친다고 적는다. 그래서 이 비율은 보조 없는 스킬들과
    # 비교 불가이고, 훅이 값을 떠받치는 동안 description 이 썩을 수 있다 — 회귀는
    # description **과** 훅 양쪽으로 읽는다.
    hook_assisted: true
    # 빈 디렉터리에서 재면 0/25 다(2026-08-28 실측). 원인은 분리되지 않았다 — 손 재현에선
    # 에이전트가 "repo 가 아니다" 만 확인하고 턴을 끝냈지만, 같은 날 자매 저장소는 같은
    # 빈 디렉터리에서 6/15 였고 이쪽 `lost_to: {vdev: 3}` 는 라우터 경쟁도 가리킨다.
    # 조건 자체를 실제 작업 조건(커밋할 것이 있는 저장소)으로 맞추는 것이 이 픽스처다.
    fixture: commit-dirty-tree
    expect_invoke: 0.10
    expect_why: >-
      주 도달 경로는 /vdev 가 커밋 단계마다 호출하는 쪽이다. 맨 "커밋해줘" 에 자율 발동하면
      티어 분류를 우회하게 되므로, 이 비율은 description 이 아직 살아 있다는 것만 증명하면 된다.
      기록된 truncated 가 높다(미스의 31%가 턴 소진) — 러너가 더 큰 예산으로 재측정을 권하지만
      옮기지 않았다: max_turns 는 COMPARABLE_CONDITIONS 라 이 스킬만 올리면 코퍼스 나머지와
      비교 불가가 되고, 선언은 어차피 생존확인용 하한이라 판정이 뒤집히지 않는다.
    # 프롬프트 열 개 전부 이 픽스처가 실제로 세우는 상태만 가정한다(spec 4.5): 더티 트리,
    # 커밋 1개, 스테이징 0건, rules/ 없음, .md 는 손대지 않은 README 하나. 초안에는 "스테이징한
    # 변경"·"커밋 세 개를 squash"·"rules 밑 .md" 처럼 픽스처가 반박하는 것이 다섯 개 있었고,
    # 그것들은 발동 여부가 아니라 없는 지시대상을 찾는 턴을 쟀다.
    happy:
      - prompt: "커밋 메시지만 써줘 — 커밋은 내가 할게."
      - prompt: "이 변경은 Conventional Commits 로 무슨 type 이 맞아?"
      # 제목을 프롬프트가 들고 온다 — 픽스처엔 고칠 제목이 없고, 그것을 찾게 두면
      # description 이 아니라 탐색을 재게 된다.
      - prompt: "커밋 제목을 `pricing 모듈에서 세금 합계 계산이 절사되던 문제를 반올림으로 수정` 으로 쓰려는데 너무 길어. 50자 안에 맞춰 다시 써줘."
      - prompt: "이 커밋 메시지 본문 초안 잡아줘."
      - prompt: "notes.txt 는 이번 변경이랑 상관없는데 같이 커밋해도 돼?"
    negative:
      - prompt: "이 변경 커밋해줘."
        kind: near
        why: "vdev 의 해피 케이스 — 이 스킬이 먼저 집으면 티어 분류를 건너뛴다(설계상 실패 모드)"
      - prompt: "이 브랜치 원격에 push 해줘."
        kind: near
        why: "같은 저장소를 상대하는 git 작업 — 작성할 커밋이 없다"
      - prompt: "마지막 커밋 되돌려줘."
        kind: near
        why: "커밋 어휘 일치 — 되돌리기는 작성·발행이 아니다"
      - prompt: "app/pricing.py 를 누가 마지막으로 바꿨는지 blame 으로 봐줘."
        kind: near
        why: "git 조회 — 커밋 어휘를 공유하지만 만들 커밋이 없다"
      - prompt: "Conventional Commits 가 뭔지 설명해줘."
        kind: far
        why: "규격 설명 요청 — 발행할 커밋이 없는 일반 지식 질의"

  # description: "Use when promoting integration to staging or staging to production,
  # cutting a release candidate, or finalizing a release — including bare asks like
  # 'stage로 올려줘', '릴리즈 해', 'main 승격', 'promote to main', 'cut an rc'. … Also use
  # when a promotion produced no release candidate and you need to know why."
  release-commit:
    # 표본 축소 — 이 두 스킬만 corpus 기본 5 대신 2. 리미트로 끊긴 재측정을 완주시키려는
    # 것이고, 점수 한 칸이 0.1 이라 해상도가 거칠어짐. 다음 재측정에서 기본으로 되돌릴 것.
    reps: 2
    # 픽스처 없음 — 트리거는 승격 어휘("승격"·"릴리즈"·"rc"·"promote")이고 프로젝트
    # 형태에 안 걸림. 실제 승격 절차는 호스트가 렌더한 release.yml 을 읽고 여러 커밋·머지를
    # 순서대로 도는 다단계 작업이라 디렉터리 하나로 세울 수 없음.
    fixture: null
    # 훅 보조(hook_assisted) — 매 세션 주입되는 rules/risk-tiers.md 가 /release-commit 을
    # 승격 요청의 행선지이자 승격 마커를 쓰는 주체로 이름 지목함. 그래서 발동률은 훅 없는
    # 스킬과 비교 불가이고,
    # description 이 썩는 동안에도 훅이 숫자를 떠받칠 수 있음 — 회귀는 description 과 훅
    # 양쪽으로 읽음.
    hook_assisted: true
    # 두 경로로 닿음 — /vdev 의 승격 포인터가 부르고, "릴리즈 해" 같은 요청이 곧바로 닿음. 그
    # 자율 팔이 이 스킬이 존재하는 이유라 commit 과 달리 생존 확인이 아니라 전문가형
    # expect_invoke 를 가짐. `reached_programmatically` 는 쓰지 않음 — 이 저장소에서 그 키는
    # 해피 축 면제(NO_HAPPY_PATH)의 기계가독 근거이고, 이 스킬에는 해피 축이 실재함(commit 과
    # 같은 판정).
    expect_invoke: 0.70
    expect_why: >-
      승격 절차는 호스트마다 정답 모양이 하나뿐이고 틀린 모양은 릴리스를 아예 안 냄. 세 번에 한 번
      승격 요청을 놓치는 스킬은 그 절차를 소유하고 있다고 할 수 없음. 0.95 를 두지 않는 이유는
      description 이 지목하는 어휘("승격"·"릴리즈")가 조회 요청과 형태를 공유하기 때문임.
    happy:
      - prompt: "stage 에 올라가 있는 변경들 production 으로 승격하려고 해."
      - prompt: "dev 를 stage 로 올리고 rc 하나 끊자."
      - prompt: "승격 머지는 됐는데 릴리스 후보가 안 나왔어. 왜지?"
      - prompt: "fix 하나 더 넣으려고 stage 를 다시 승격해야 해. 범프 레벨은 어떻게 되지?"
      - prompt: "이 저장소는 범프 레벨을 커밋 트레일러로 강제해, 워크플로 dispatch 로 강제해?"
    negative:
      - prompt: "방금 만든 변경들 커밋해줘."
        kind: near
        why: "vdev 의 해피 — 일상 변경 라우팅은 승격이 아님"
      - prompt: "이 변경에는 어떤 Conventional Commits 타입을 붙여야 해?"
        kind: near
        why: "commit 의 해피 — 메시지 하나를 쓰는 것이지 승격을 도는 것이 아님"
      - prompt: "이 프로젝트에 릴리스 워크플로를 깔아줘."
        kind: near
        why: "vdev-init 이 릴리스 워크플로를 렌더함. 이 스킬은 그것을 읽기만 함"
      - prompt: "지금 stage 브랜치에 main 대비 뭐가 더 올라가 있는지 목록만 보여줘."
        kind: near
        why: "승격 쌍(staging→production) 어휘를 그대로 쓰지만 읽기 전용 조회 — vdev 에서 옮겨온 문장"
      - prompt: "릴리스 후보가 뭔지 설명해줘."
        kind: far
        why: "개념 설명 — 절차 진입이 아님"

  # description: "Use when comments, docstrings or documents need checking against the prose
  # rules — before writing them, or to clean up what is already there. The doc-sync gate calls it."
  prose-review:
    # prose-review-comments 가 세우는 것: app/pricing.py 하나에 산문 규칙이 이름 대는 실패가
    # 전부 들어 있음 — author 태그·변경 이력·수정일 헤더, 아랫줄을 되풀이하는 주석 둘,
    # 어떻게를 설명하는 독스트링, 다른 파일로 건 줄 앵커. 해피 다섯이 지목하는 대상이 전부
    # 그 파일에 실재함.
    fixture: prose-review-comments
    # `hook_assisted` 없음 — 이 플래그는 주입 텍스트가 스킬을 **호명**하는지로 정해지는데
    # (역검사는 tests/skill_docs/test_injected_rule.py), doc-style 룰 본문은 이 스킬 이름을
    # 대지 않음. 다만 그 룰 **전문**이 매 세션 주입되므로 이 스킬의 주제 자체는 이미 앞에
    # 놓여 있음: `description_sha` 가 접지 않는 종류의 도움이라, **떨어진** 수치는
    # description 으로 읽고 오른 수치는 그 주입으로도 설명됨.
    expect_invoke: 0.60
    expect_why: >-
      해피가 description 의 어휘(주석·독스트링·산문 규칙)를 그대로 쓰지만, 경쟁자가 둘 있어
      0.70 을 선언하지 않음. doc-sync 는 같은 "변경된 파일의 산문을 다시 씀" 을 하고, 주석
      정리 요청은 스킬 없이 직접 편집해도 합리적임 — 경계가 실제로 흐린 쪽이라 미발동이
      곧 오답은 아님. 측정 전 선언값이고, 근거는 자매 저장소가 같은 코퍼스에서 선언한 값임.
    happy:

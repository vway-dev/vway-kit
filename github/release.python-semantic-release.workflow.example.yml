# 의미기반 릴리스 (Python/python-semantic-release) — /vdev-init 이 vdev-config.versioning 으로 렌더.
# vway-release-levels: auto continue patch minor major
#  · __VWAY_PRERELEASE__ : HEAD 커밋의 `Release-Level:` 트레일러로 rc. continue/patch/minor/major 는
#                          결정적 적용(대기 rc 가 있으면 그 base 기준 — continue=rc.N+1), auto·트레일러
#                          없음은 커밋 타입 자동 → X.Y.Z-rc.N
#  · __VWAY_STABLE__     : 대기 중인 rc 를 정식으로 finalize(-rc.N 제거). PSR 은 강제-어긋난 rc 를
#                          정식화하지 못해(auto=재계산 상향, --patch=이중bump) 결정적 스텝으로 처리.
#                          rc 가 없으면(hotfix 등) 트레일러 patch/minor/major 를 결정적 적용, 없으면 auto.
# 버전 계산은 호스트 사본 .claude/vway-kit/scripts/release_version.py(/vdev-init 이 복사).
# release 커밋은 [skip ci]. 상세 설정([tool.semantic_release])은 프로젝트 pyproject 에 둔다.
# 릴리스 본문: 정식은 CHANGELOG 의 vX.Y.Z(+rc.*) 섹션을 버전매칭 집계, 비면 자동 노트 폴백.
#   깨끗한 CHANGELOG 를 위해 pyproject 에 exclude_commit_patterns 권장(commit-versioning-guide).
# 인증: 저장소 전용 PAT 시크릿 RELEASE_TOKEN(권장) 또는 미등록 시 내장 GITHUB_TOKEN 폴백
#       (그 경우 repo Settings→Workflow permissions=Read and write 필요). 요구 권한·설정
#       절차는 preflight 안내 및 docs/operations/commit-versioning-guide.md 를 SSOT 로 참조.
name: release

on:
  push:
    branches: [__VWAY_STABLE__, __VWAY_PRERELEASE__]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # RELEASE_TOKEN 미등록 시 폴백하는 내장 GITHUB_TOKEN 에 쓰기 부여
                    # (repo Settings → Workflow permissions 이 read-only 면 여전히 막힘 → preflight 안내)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # 방금 만든 태그(verbatim). 릴리스하지 않은 실행이면 빈 문자열.
      # deploy 배선(.github/workflows/deploy.yml 호출)이 이 값으로 스킵을 판정한다.
      tag: ${{ steps.released.outputs.tag }}
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Preflight — 릴리스 쓰기 권한 검증(1회)
        env:
          TOK: ${{ secrets.RELEASE_TOKEN || github.token }}   # 시크릿 없으면 내장 GITHUB_TOKEN 폴백
          RT: ${{ secrets.RELEASE_TOKEN }}                     # 어느 쪽을 쓰는지 판별용
          REPO: ${{ github.repository }}
        run: |
          # 안내문을 파일로 저장 → preflight 실패·이후 커밋/push 실패(마지막 스텝) 모두 공유(중복 제거).
          cat > /tmp/release_token_guide.txt <<'G'
          ============== 릴리스 CI 쓰기 권한 안내 ==============
          릴리스 워크플로가 커밋/태그 push·릴리스 생성을 하려면 저장소 쓰기 권한이
          필요합니다. 아래 [A] 또는 [B] 중 하나면 됩니다.
          [A] (권장·세분화) 저장소 전용 PAT 시크릿 RELEASE_TOKEN
              1) fine-grained PAT — Settings → Developer settings → Fine-grained
                 tokens → 이 저장소 선택 → Repository permissions:
                   Contents = Read and write  (Metadata=Read 자동)
              2) 저장소 → Settings → Secrets and variables → Actions →
                 New repository secret → Name: RELEASE_TOKEN
          [B] (간편·시크릿 불필요) 내장 GITHUB_TOKEN 에 쓰기 허용
              저장소 → Settings → Actions → General → Workflow permissions →
              "Read and write permissions" 선택 (관리자 1회 토글)
          자세히: docs/operations/commit-versioning-guide.md (릴리스 토큰)
          =====================================================
          G
          if [ -z "${TOK:-}" ]; then
            echo "::error::릴리스 토큰이 비어 있습니다."; cat /tmp/release_token_guide.txt; exit 1
          fi
          [ -n "${RT:-}" ] && echo "인증: RELEASE_TOKEN 사용" || echo "인증: 내장 GITHUB_TOKEN(폴백) 사용 — 위 [B] 설정 필요"
          API="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          # 저장소 접근(read) 확인.
          lcode=$(curl -sS -o /tmp/ls.json -w "%{http_code}" "${auth[@]}" "$API/contents" || echo 000)
          if [ "$lcode" != "200" ]; then
            echo "::error::저장소 접근 실패(HTTP $lcode)."; cat /tmp/release_token_guide.txt; exit 1
          fi
          # 쓰기 권한 검증(비파괴) — 기존 파일에 '틀린 sha' 로 PUT → 403/401=쓰기없음,
          # 그 외(409 등)=쓰기있음(sha 충돌로 실제 기록 안 됨). .permissions.push 는 fine-grained
          # PAT 의 실제 스코프가 아니라 사용자 role 을 반영해 신뢰 불가 → 실제 write 를 프로브한다.
          ppath=$(python3 -c "import json;a=json.load(open('/tmp/ls.json'));print(next((x['path'] for x in a if x.get('type')=='file'),''))" 2>/dev/null || echo "")
          if [ -n "$ppath" ]; then
            wcode=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT "${auth[@]}" "$API/contents/$ppath" \
              -d '{"message":"vway preflight write probe (no-op)","content":"eA==","sha":"0000000000000000000000000000000000000000"}' || echo 000)
            case "$wcode" in
              401|403)
                echo "::error::릴리스 토큰에 쓰기 권한이 없습니다(HTTP $wcode). 위 [A] 또는 [B] 로 부여하세요."
                cat /tmp/release_token_guide.txt; exit 1 ;;
              *) echo "preflight OK — 쓰기 권한 확인(write-probe HTTP $wcode)." ;;
            esac
          else
            echo "preflight — write 프로브 대상 파일 없음, push 단계에서 확인."
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: 릴리스 전 최신 태그 기록
        id: pretag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        # `==` 로 고정한다(rule-version-pinning). 부동 지정이었을 때 gitpython 3.1.60 이
        # `Actor.name_email_regex` 를 제거하면서 PSR 10.x 가 그것을 참조하다 죽었고
        # ("type object 'Actor' has no attribute 'name_email_regex'", 2026-08-28), 코드가
        # 한 줄도 안 바뀐 저장소의 릴리스가 그날 갑자기 실패했다. 업그레이드는 이 줄을
        # 고치는 의도적 변경으로만 한다.
        run: pip install "python-semantic-release==10.5.3" "gitpython==3.1.50"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (prerelease=rc bump / stable=finalize)
        id: sr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          # >>> vway-release-version — 다섯 릴리스 템플릿 공통(tests/test_release_rc_version.py 가 고정)
          RV=.claude/vway-kit/scripts/release_version.py
          if [ ! -f "$RV" ]; then
            echo "::error::$RV 없음 — /vdev-init 을 다시 실행해 스크립트 사본을 커밋하세요."
            exit 1
          fi
          git fetch --tags --force --quiet origin || true
          MSG="$(git log -1 --pretty=%B)"
          TAGS="$(git tag --list)"
          # <<< vway-release-version
          BEFORE="$(git rev-parse HEAD)"
          if [ "${{ github.ref_name }}" = "__VWAY_PRERELEASE__" ]; then
            NEXT="$(python3 "$RV" next --message "$MSG" --tags "$TAGS")" || exit 1
            if [ "$NEXT" != auto ]; then
              # 강제 레벨은 계산된 버전을 결정적으로 적용 — PSR 의 --<level> --as-prerelease 는 continue 를
              # 표현하지 못함. 추가 version_variables 를 쓰면 아래에 sed 와 git add 를 더한다.
              sed -i -E 's/^version = ".*"$/version = "'"$NEXT"'"/' pyproject.toml
              git add pyproject.toml
              git commit -m "chore(release): $NEXT [skip ci]" \
                -m "Release-Level 트레일러로 계산한 $NEXT 를 결정적으로 적용."
              git tag "v$NEXT"
              # 일시 장애만 재시도, rebase 안 함 — 버전·노트가 이 트리에서 계산됨.
              # --atomic: 브랜치와 태그가 함께 오르거나 둘 다 안 오름.
              for attempt in 1 2 3; do
                git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v$NEXT" && break
                [ "$attempt" -lt 3 ] || exit 1
                sleep $((attempt * 5))
              done
            else
              # auto·트레일러 없음: 커밋 타입으로 rc 를 유도. GitHub Release 는 아래 스텝의
              # `gh release create` 가 만듦 — PSR 이 먼저 만들면 그 스텝이 실패(--no-vcs-release).
              semantic-release version --commit --tag --push --changelog --no-vcs-release
            fi
          else
            # stable: 대기 중인 rc 를 정식으로 finalize. PSR 은 강제-어긋난 rc 를 못 살려
            # 결정적으로 -rc.N 을 제거한다.
            CUR="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            case "$CUR" in
              *-*)
                STABLE="$(python3 "$RV" finalize --rc "v$CUR" --tags "$TAGS")" || exit 1
                echo "finalize: $CUR -> $STABLE"
                # pyproject [project].version 정식화(heredoc 회피 — sed 인라인).
                # 추가 version_variables(예: src/pkg/__init__.py)를 쓰면 아래에 sed 와 git add 를 더한다.
                sed -i -E 's/^version = ".*"$/version = "'"$STABLE"'"/' pyproject.toml
                git add pyproject.toml
                git commit -m "chore(release): $STABLE [skip ci]" \
                  -m "rc $CUR 를 정식 $STABLE 으로 finalize(강제-어긋난 rc 는 PSR 로 정식화 불가)."
                git tag "v$STABLE"
                # 일시 장애만 재시도, rebase 안 함 — 버전·노트가 이 트리에서 계산됨.
                # --atomic: 브랜치와 태그가 함께 오르거나 둘 다 안 오름.
                for attempt in 1 2 3; do
                  git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v$STABLE" && break
                  [ "$attempt" -lt 3 ] || exit 1
                  sleep $((attempt * 5))
                done
                ;;
              *)
                # rc 없음(hotfix 등): 트레일러 patch/minor/major 면 결정적 적용, 없으면 auto.
                NEXT="$(python3 "$RV" stable --message "$MSG" --tags "$TAGS")" || exit 1
                if [ "$NEXT" != auto ]; then
                  # 강제 레벨은 계산된 버전을 결정적으로 적용 — PSR 의 --<level> --as-prerelease 는 continue 를
                  # 표현하지 못함. 추가 version_variables 를 쓰면 아래에 sed 와 git add 를 더한다.
                  sed -i -E 's/^version = ".*"$/version = "'"$NEXT"'"/' pyproject.toml
                  git add pyproject.toml
                  git commit -m "chore(release): $NEXT [skip ci]" \
                    -m "Release-Level 트레일러로 계산한 $NEXT 를 결정적으로 적용."
                  git tag "v$NEXT"
                  # 일시 장애만 재시도, rebase 안 함 — 버전·노트가 이 트리에서 계산됨.
                  # --atomic: 브랜치와 태그가 함께 오르거나 둘 다 안 오름.
                  for attempt in 1 2 3; do
                    git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v$NEXT" && break
                    [ "$attempt" -lt 3 ] || exit 1
                    sleep $((attempt * 5))
                  done
                else
                  echo "no prerelease pending → 정상 auto 릴리스"
                  semantic-release version --commit --tag --push --changelog --no-vcs-release
                fi
                ;;
            esac
          fi
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" != "$AFTER" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; fi

      - name: 방금 만든 태그 노출
        id: released
        env:
          BEFORE: ${{ steps.pretag.outputs.tag }}
        run: |
          # jreleaser 처럼 도구가 원격에서 태그를 만드는 경우가 있어 fetch 가 필수다.
          git fetch --tags --force
          AFTER="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then
            echo "tag=$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"   # 릴리스하지 않음 → deploy 스킵
          fi

      - name: Create GitHub Release
        if: ${{ steps.sr.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          if [ "$REF_NAME" = "__VWAY_PRERELEASE__" ]; then
            # rc(prerelease): GitHub 자동 노트 유지.
            gh release create "$TAG" --title "$TAG" --generate-notes --prerelease
          else
            # 정식 본문: PSR CHANGELOG 에서 이 버전(정식 vX.Y.Z + 그 rc.*) 섹션의
            # Features/Bug Fixes/Performance 만 버전매칭으로 집계한다(Chores 등 자동 제외).
            # finalize 는 내용을 rc 태그에 귀속시키므로 vX.Y.Z 와 vX.Y.Z-rc.* 를 함께 매칭.
            # 매칭이 비면 GitHub 자동 노트로 폴백. CHANGELOG 정리는 pyproject
            # [tool.semantic_release.changelog] exclude_commit_patterns 권장(guide 참조).
            VER="${TAG#v}"
            BODY="$(awk -v ver="$VER" '
              BEGIN { hdr="^## v" ver "([ (]|-rc[.])" }
              /^## /  { inver=($0 ~ hdr); cur=""; next }
              /^### / { cur=""; if (inver) { h=tolower($0);
                        if (h ~ /breaking/) cur="brk";
                        else if (h ~ /features/) cur="feat";
                        else if (h ~ /bug fixes/) cur="fix";
                        else if (h ~ /performance/) cur="perf" } next }
              cur=="brk"  { brk=brk $0 "\n" }
              cur=="feat" { feat=feat $0 "\n" }
              cur=="fix"  { fix=fix $0 "\n" }
              cur=="perf" { perf=perf $0 "\n" }
              END { if (brk)  printf "### Breaking Changes\n%s\n", brk;
                    if (feat) printf "### Features\n%s\n", feat;
                    if (fix)  printf "### Bug Fixes\n%s\n", fix;
                    if (perf) printf "### Performance\n%s\n", perf }
            ' CHANGELOG.md 2>/dev/null || true)"   # 파일 부재/오류 → 빈 값 → 아래 자동 노트 폴백
            if [ -n "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
              printf '%s' "$BODY" > "$RUNNER_TEMP/relnotes.md"
              gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/relnotes.md"
            else
              gh release create "$TAG" --title "$TAG" --generate-notes   # 매칭 섹션 없으면 폴백
            fi
          fi

      - name: 정식 릴리스 노트 — CHANGELOG 절
        if: ${{ github.ref_name == '__VWAY_STABLE__' && steps.released.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VWAY_SCRIPTS: .claude/vway-kit/scripts
          TAG: ${{ steps.released.outputs.tag }}
        run: |
          # >>> vway-release-notes — 일곱 릴리스 워크플로 공통(tests/test_release_notes_block.py 가 고정)
          CS="$VWAY_SCRIPTS/changelog_section.py"
          if [ -f "$CS" ] && python3 "$CS" extract --version "${TAG#v}" > "$RUNNER_TEMP/notes.md"; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
              || echo "::warning::$TAG 릴리스 본문을 CHANGELOG 절로 바꾸지 못했습니다."
          else
            echo "CHANGELOG 에 $TAG 정식 절 없음 — 만들어진 릴리스 본문을 그대로 둡니다."
          fi
          # <<< vway-release-notes

      - name: 실패 안내 — 커밋/태그 push·릴리스 실패 시 쓰기 권한 점검
        if: ${{ failure() }}
        run: |
          echo "::error::릴리스 실패. 커밋/태그 push 또는 릴리스 생성 단계가 실패했다면 릴리스 토큰 쓰기 권한 문제일 가능성이 큽니다(RELEASE_TOKEN 또는 Workflow permissions)."
          cat /tmp/release_token_guide.txt 2>/dev/null || echo "(안내문 미생성 — preflight 이전 단계에서 실패)"

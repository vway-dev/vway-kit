# vway-kit srs-verify CI — /vdev-init 이 그대로 복사한다(치환 토큰 없음).
# docs/srs 위 요구 텍스트 무결성: 커밋 게이트는 SRS 를 읽지 않으므로, 한 브랜치에서 생긴 죽은
# 앵커·중복 id 가 다른 브랜치와 충돌할 때에야 드러난다 — 여기서 그 push/PR 을 대신 실패시킨다.
# 옵트인: docs/srs 가 있어야 /vdev-init 이 제안한다 — 그 전에는 가리킬 대상이 없다. docs/srs
# 가 없으면 srs_check.py --verify 가 무출력 exit 0 이라 job 은 green 을 유지한다. 스크립트가
# 체크아웃에 없을 때(.claude/ 를 gitignore 하는 저장소)도 같은 결과 — 단계 자체의 가드가
# 덮는다.
name: srs-verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  srs-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify SRS anchors and links
        # 이 파일을 렌더하는 쪽이 무엇이든 가드는 그대로 유지된다: .claude/ 를 gitignore 한
        # 저장소는 체크아웃에 스크립트가 아예 없고, python3 는 파일 부재로 exit 2 할 것이다 —
        # SRS 를 한 번도 켜지 않은 저장소에서 매 푸시가 빨개진다.
        run: |
          if [ ! -f .claude/vway-kit/scripts/srs_check.py ]; then
            echo "no srs_check.py in the checkout - nothing to verify"
            exit 0
          fi
          python3 .claude/vway-kit/scripts/srs_check.py --verify

# vdev 위험도 티어 환경 설정 템플릿
# 프로젝트 팀이 호스트의 .claude/vway-kit/config/vdev-config.yaml 로 복사하여 값을 채운다.
# (실파일은 git 추적 — 같은 저장소를 공유하는 모든 개발자가 동일 설정을 쓴다. 자격증명은 keyring.)
# Team-specific configuration template for vway-kit risk-tiered workflow

branches:
  # feature가 머지되는 통합 브랜치 (보통 dev 또는 develop)
  integration: dev

  # QA 승격 브랜치 (보통 stage 또는 staging)
  staging: stage

  # 프로덕션 릴리스 브랜치 (일반적으로 main)
  production: main

  # feature 브랜치 이름 접두사 (예: feature/, feat/)
  feature_prefix: "feature/"

# 모듈 단위 사전검사 (모노레포 — 모듈별 언어·도구가 다를 때). 단일스택도 모듈 하나로 표현.
# 선언하면 레이어2 vdev 게이트(Claude 세션 커밋)가 "변경 모듈 전체"에 검증을 돌린다.
# checks 는 가변 키 — 임의 이름의 검사를 선언한다(lint/static/import_lint/test/security 는
# 관습 키). 값은 문자열(명령) 또는 확장 형식 { run: <명령>, when: <타이밍> }.
# 이 값들의 초안은 /vdev-init 이 harness docs SSOT 를 참고해 작성하고, 사람이 수정한다.
# 타이밍(when): every-commit(변경 모듈, 매 커밋 — precommit 버킷) /
#            promotion(전체 모듈, staging·release 승격 — security-scan 버킷).
# 하위호환: 문자열은 every-commit, 단 키가 'security' 면 promotion 으로 라우팅한다.
# 타이밍은 해당 티어에 그 버킷 게이트(precommit/security-scan)가 있어야 발동한다.
# (구버전 전역 test.command 는 폐기 — 모듈별 checks 로 이전. 레이어1 pre-commit 모듈 훅도 폐기.)
modules:
  - name: api
    path: services/api/
    checks:
      lint:        "ruff check services/api"
      static:      "uv run pyright services/api"
      import_lint: "uv run lint-imports --config services/api/.importlinter"
      test:        "uv run pytest services/api"
      security:    "uv run bandit -r services/api --severity-level medium"
      license-check: { run: "reuse lint", when: every-commit }   # 커스텀(확장 형식)
  - name: web
    path: services/web/
    checks:
      lint:   "npm --prefix services/web run lint"
      static: "npm --prefix services/web run typecheck"
      test:   "npm --prefix services/web test"

# 회귀·계약·이디엠포턴시 검토 체크리스트 — Dev `review` 게이트가 변경 파일마다
# 대조하는 항목
review_checklist:
  - "regression / 회귀 테스트 통과"
  - "cross-service contract / 서비스 간 계약 유효성"
  - "DB transaction / migration / DB 트랜잭션·마이그레이션 안전성"
  - "async task idempotency / 비동기 작업 멱등성"

# 호스트 자신의 커밋·버저닝 문서. /harness-init 이 생성하는 경로이고, `commit` 스킬이
# 이 파일을 읽어 프로젝트 고유 사실(스코프 어휘·0.x 정책·릴리스 도구가 커밋 타입에서
# bump 를 파생하는지)을 자기 일반론보다 우선한다. 그 문서의 나머지 주제 — 어느 파일이
# 버전을 들고 있는지, changelog 를 어떻게 거르는지 — 는 릴리스 CI 의 것이지 커밋 한 건을
# 쓰는 일의 것이 아니다. 메시지 **형식**도 협상 대상이 아니다 — 50/72 와 type 표는
# 이 파일이 있든 없든 rules/commit-discipline.md 가 소유한다. 의도적으로 최상위다
# (`versioning:` 하위 아님): versioning.enable: false 인 프로젝트도 커밋은 한다.
# 값이 비었거나 파일이 없으면 스킬은 commit-discipline 만으로 돈다.
commit_guide: docs/operations/commit-versioning-guide.md

# 호스트 자신의 이슈트래커 규약 문서. `commit_guide` 와 같은 꼴 — config 는 경로만 들고
# 사실은 그 문서가 든다. ALM 스킬(task-import·task-sync·alm-trace)이 있으면 읽고 그 안의
# 프로젝트 고유 사실을 자기 일반론보다 우선한다.
# 경계는 **누가 읽느냐**가 가른다: 스크립트가 판정에 쓰는 값(layers·fields·보드 이름·상태 키)은
# 위 config 가 들고, 모델·사람이 읽는 규약(보드를 그렇게 나눈 이유·라벨 옵션 규약·suite 이름
# 규약·회차 category 어휘·결함 승격 기준)은 이 문서가 든다. 기계가 쓸 값을 산문에 두면 파서가
# 없어 판정이 통째로 빠지고, 규약을 config 주석에 두면 호스트가 자기 규약을 못 적는다.
# 값이 비었거나 파일이 없으면 스킬은 자기 일반론만으로 돈다.
# 이 문서는 **호스트가 직접 저작**한다 — `commit_guide` 와 달리 생성기가 없다. 보드 구성이
# 프로젝트마다 다르므로 지어낼 수 있는 초안이 없고, 없는 채로 도는 것이 정상 경로다.
issue_tracker_guide: docs/operations/issue-tracker.md

# ALM 연동 — task-import · task-sync · alm-trace
# provider 가 기본 공급자. 요청 텍스트가 덮어씀("Teamer 연동" 이라 말하면 Teamer 로).
# task-id 모양 토큰(DEV-0952)만으로는 어떤 ALM 조회도 안 일어남.
alm:
  # recoble | teamer | none | 리스트 [recoble, teamer]
  #   리스트 = 나열 순서대로 전부 전송(한쪽이 실패해도 나머지는 계속)
  #   none   = ALM 단계 통째 건너뜀
  provider: recoble

  # true  = /vdev 가 시작 시 항목을 만들고 끝날 때 상태·요약 갱신
  # false = 사용자가 요청할 때만 연동
  auto: true

  # true  = task-sync 가 summary 끝에 Worklog 섹션을 붙임 — 착수·완료 시각과 AI Agent 활동
  #         시간(HH:MM). 활동 시간은 Claude·Codex 세션 기록에서 이 작업 브랜치의 시간만 셈
  # false = 안 붙임(키 부재와 같음). 셈 규칙은 docs/usage/alm.md 'Worklog'
  worklog: false

  recoble:
    default: labs                  # 요청이 스페이스를 안 밝혔을 때 쓸 키

    # MCP 등록은 사람 몫 — /vdev-init 은 등록 상태를 읽어 판정하고 실행할 명령만 출력:
    #   claude mcp add -t http recoble-labs <mcp_url> -H "Authorization: Bearer <PAT>"
    # local 스코프(~/.claude.json)에 저장되므로 PAT 는 이 파일에 안 들어옴.
    spaces:
      labs:                        # 키는 [a-z0-9-] 만 — MCP 툴 이름에 그대로 들어감
        # Recoble 웹 MCP 연결 화면에서 복사. 자격증명 아님(PAT 없이 접속하면 401)
        mcp_url: "https://mcp.recoble.com/s/00000000-0000-0000-0000-000000000000/mcp"
        # 보드는 이름 또는 id. 사람이 미리 만들어 둠 — 자동 생성 없음, 오타면 실행 중단.
        # 이름은 스페이스 안에서 유일하지 않음 — 같은 이름이 둘이면 id 로 적음.
        workboard: "dev-board"

        # 상태 키 — 보드마다 다름(list_workboard_statuses 로 확인).
        # 생략하거나 보드에 없는 키면 그 전이만 건너뜀.
        # "시작 전" 키는 없음 — 생성 시 status 를 생략하면 보드 entry 상태로 앉음.
        status_start: IN_PROGRESS    # 착수
        status_review: IN_REVIEW     # 구현 완료(검토)
        status_done: COMPLETED       # 검증 완료

        # 계층 추적(alm-trace) — 선언하면 요구사항→설계→작업→검증을 만듦.
        # 없으면 task-import 경로(항목 하나 pull/push).
        # 계층 키는 자유 — 의미는 이름이 아니라 derives_from·verifies·marker·feature_design 이 줌.
        # template 생략 시 alm/<계층키>.md(키의 `/`·`\` 는 `_` 로 접힘).
        # 호스트 사본은 .claude/vway-kit/templates/
        # 밑이고 그것이 플러그인 출하본을 이김(/vdev-init 이 선언된 것만 거기 시드).
        # defect: true 인 계층 하나가 **결함 진입**을 켬(marker 와 같은 꼴) — 요청이 이미
        # 있는 작업의 결함이면 그 보드에 결함 항목을 만들고, 어긴 요구사항·작업에 verifies
        # 로 걸고, marker 계층에 수정 작업을 만들어 derives 로 이음.
        # 미선언이면 결함 분기가 없고 모든 요청이 신규 요구사항으로 감.
        # layers:
        #   requirement:
        #     workboard: "요구사항"
        #     template: alm/requirement.md
        #   design:
        #     workboard: "설계"
        #     derives_from: requirement        # 요구사항 --도출--> 설계
        #     template: alm/design.md
        #     feature_design: true             # 기능 하나 = 설계 항목 하나, 오래 사는 설계서
        #     # 기능 설계 항목은 그 기능에 닿는 요구사항·작업이 모두 공유함. 그래서 전파의
        #     # 상위도 하위도 아님 — 한 요구사항의 작업이 끝나 설계가 닫히면 공유한 다른
        #     # 요구사항까지 닫힘. 작업은 요구사항에 직접 도출 링크로도 걸리고 전파는 그 링크를 탐.
        #     # 설계를 쓸 때는 큰 틀(기능 분류)부터 찾고, 없으면 조사해서 만듦(alm-trace §5-1).
        #     # 본문은 마무리 때 확정 내용으로 다시 씀(task-sync R5b).
        #     # 미선언이면 설계는 변경마다 항목 하나이고 전파 체인에 들어감.
        #     # 기능은 워크플로우 단위로 두어 코드 디렉터리와 1:1 로 맞춘다 — 디렉터리가
        #     # 사라지면 설계 항목이 낡은 것이 함께 드러난다.
        #     # 라벨 필드와 그 선택지는 보드처럼 사람이 먼저 둔다(이 기능은 안 만든다).
        #     fields:                          # 역할 → 그 보드의 실제 필드 key
        #       module: service                # 왼쪽이 역할(스펙 고정), 오른쪽은 보드가 정함
        #       feature: feature
        #   task:
        #     workboard: "개발 작업"
        #     derives_from: design
        #     template: alm/task.md
        #     marker: true                     # 많아야 하나 — /vdev 마커에 실릴 계층
        #   verification:
        #     workboard: "테스트 케이스"
        #     verifies: requirement            # 검증 --검증--> 요구사항
        #     template: alm/verification.md
        #     status: NOT_STARTED              # 선택 — 생략 시 상태를 안 건드림
        #     category: "검증"                 # 선택 — 보드를 다른 유형과 나눠 쓸 때
        #     fields:                          # 케이스는 상태가 아니라 필드가 판정을 든다
        #       latest_result: latest_result   # 최신 판정 — 상태축은 전진 전용이라 못 씀
        #       latest_run: latest_run         # 그 판정을 낸 회차
        #       suite: suite
        #       covers: covers                 # 검증하는 수용 기준 번호
        #   defect:
        #     workboard: "결함 관리"
        #     verifies: requirement            # 결함 --검증--> 요구사항(어긴 것을 지목)
        #     template: alm/defect.md
        #     defect: true                     # 결함이 앉을 계층 — 많아야 하나
        #     # 결함 --도출--> 수정 작업 링크는 여기 없음: 수정 작업은 marker 계층이고
        #     # 그 계층은 평소 design 에서 도출된다. 결함 경로일 때만 결함에서 도출되는
        #     # 경로별 관계라 정적 선언에 안 들어가고, 실행 중에 그어진다.
        #   run:
        #     workboard: "테스트 실행"
        #     run: true                        # 회차가 앉을 계층 — 많아야 하나
        #     runs: verification               # 이 회차가 담는 케이스 계층
        #     template: alm/run.md
        #     category: "승격검증"              # 이 계층의 기본 유형. 개발서버 확인은 스킬이
        #                                      # "개발검증" 으로 덮음 — 두 값 다 보드 옵션에
        #                                      # 있어야 함(없는 값은 유령 값)
        #     # 회차는 relates_to 로만 붙어 **전파 분모 밖**이다. derives_from·verifies 를
        #     # 적으면 지우고 경고한다 — 옛 회차가 상위의 하위집합에 영원히 남으면 집합이
        #     # 단조 증가하다 페이지를 넘겨 전파가 스스로 꺼진다.
        #     fields:
        #       result: result                 # PASS·FAIL·BLOCKED·NOT_APPLICABLE·NOT_RUN
        #       scope: scope                   # 이 회차가 돌기로 한 suite 집합 = 커버리지 분모
        #       build: build                   # 검증 대상 커밋 sha
        #       environment: environment

        # 전파가 닿는 다른 보드의 상태 키(키 = 보드 id 또는 이름 — 이름이 중복이면 그
        # 항목은 건너뛰고 경고하므로 id 로 적음).
        # done 은 플래그로 판정되어 보통 불필요. status_review 는 파생되지 않으므로
        # (검토와 진행 중이 같은 statusGroup) 닿는 보드마다 적어야 상위가 검토까지 감.
        # boards:
        #   "검증 보드": { status_review: REVIEWING, status_done: VERIFIED }
      client-a:                    # 두 번째 스페이스 예시 (필요 없으면 삭제)
        mcp_url: "https://mcp.recoble.com/s/11111111-1111-1111-1111-111111111111/mcp"
        workboard: "client-a-dev"

    # 상태 전파 — 하위 → 상위 한 방향. 상위를 닫아 하위까지 닫는 일은 없음.
    # 판정 근거 = links 가 켠 경로를 합친 하위집합의 완료 비율(M:N 이라 항목 id 로 중복 제거).
    propagate:
      enable: false
      # parent    = parentTaskId (보드 안의 계층)
      # hierarchy = parent_of 링크 (source=상위, target=하위) — 보드를 넘는 체인
      # derives   = 도출/도출됨 (source=상위) — 요구사항에서 갈라져 나온 항목
      # verifies  = 검증/검증됨 (source=하위) — 검증하는 쪽이 끝나야 검증받는 쪽이 닫힘
      links: [parent, hierarchy, derives, verifies]
      progress: rollup             # rollup = 하위 완료 비율로 갱신(식: recoble-propagation 「판정」) | off
      # all-done = 하위 전부 done 이어야 상위를 done 으로. 하나라도 끝나면 시작 전 상위를
      #            진행으로 올림(강등 없음) | ask = 판정을 보여주고 승인 후 적용 | off
      status: all-done
      depth: 0                     # 0 = 상위가 닫히면 그 상위까지 연쇄 | N = N 단계까지

  # Teamer.live — "Teamer 연동" 명시 또는 provider 에 teamer 가 있을 때만 쓰임
  teamer:
    project_no: "996"              # task-sync 의 ?project_no=
    workitem_no: "188180"          # task-sync 의 ?workitem_no=
    workflow_no: "164489"          # 상태 전이 시 status_no 를 조회할 워크플로

# 인수인계(handoff) — 작업이 끝난 뒤 task-sync 가 그 **작업 항목 하나**의 필드들을 채움.
# 종류 하나 = 필드 하나. 키는 확장점(qa 외 ops·security 등). 미설정 시 summary 만 동작.
# 본문은 Markdown 하나 — template 한 파일을 Teamer 필드도 Recoble 댓글·본문도 함께 씀.
#
# field = 쓸 대상. 문자열이면 Teamer 어휘(item_content·colXX)이고 Recoble 은 댓글로 감.
#         provider 별 dict 면 각자 대상 지정, 키가 없는 provider 에는 안 보냄.
#         value 를 가진 literal 은 댓글 폴백에서 빠짐 — Recoble 에 쓰려면 dict 로 명시.
# Recoble 대상: comment(기본) · description(항목 본문) · custom:<필드-key>
#             · priority·startDate·endDate·category(literal 만). progress 는 대상 아님.
#             custom 은 필드 id 가 아니라 key. 긴 글은 RICH_EDITOR 타입에만.
handoff:
  summary:                          # 기본 AI 요약 = handoff 의 한 종류
    enable: true
    author: AI                      # AI|LLM|Agent → AI 대필 / 그 외 → 사람 이름
    AskUserQuestion: false          # true 면 실행 시 AskUserQuestion 으로 입력/지침
    field: item_content             # item_content → append
    # template: handoff/summary.md  # 생략 시 handoff/<종류>.md
    # (.claude/vway-kit/templates/ 밑 호스트 사본이 플러그인 출하본을 이김)
    # 값은 그 디렉터리 안에 머물러야 함 — `..`·절대경로는 거절되고 기본값으로
    # 떨어지며 /vdev-init 이 [!] 로 알림(셋업이 이 rel 로 파일을 옮기기 때문)
  qa:                               # 신규 종류 예시 (필요 없으면 삭제/enable:false)
    enable: false
    author: AI
    AskUserQuestion: true
    field:                          # provider 별 지정 — 없는 키는 그 provider 에서 생략
      teamer:  col22                # colXX → replace (전용 필드)
      recoble: "custom:impl_note"   # list_workboard_fields 로 key·type·선택지 확인
    instruction: "QA 인수인계 — 테스트 범위, 재현 절차, 리스크 포인트"
    # template: handoff/qa.md       # 선택 — 생략 시 instruction 만으로 작성
  done_flag:                        # 신규 종류 — 특정 필드에 고정값
    enable: false
    # author 불필요 — value(literal) source 는 작성자 줄을 붙이지 않음
    field: col31                    # colXX → replace 기본
    value: "완료"                   # value 있으면 template/AI/작성자 줄 생략, 값 그대로
    append: false                   # 누적(true)/교체(false) 명시 — 미지정 시 field 기본
  done_date:                        # 신규 종류 — 특정 필드에 자동 날짜
    enable: false
    field: col30
    value: "${today}"               # 실행일(YYYY-MM-DD)로 치환
    append: false
  start_date:                       # 착수일 → 보드 날짜 필드(보드에 필드가 있을 때만 켬)
    enable: false
    field: {recoble: startDate}     # Teamer 는 {teamer: colXX}
    value: "${started}"             # task 문서 **Created:** 의 날짜(YYYY-MM-DD)
    append: false
  end_date:                         # 완료일 → 보드 날짜 필드
    enable: false
    field: {recoble: endDate}
    value: "${today}"
    append: false

# 승격 검증(release-commit 의 검증 회차 단계)의 완료 기준. **키가 없는 것이 기본** — 그때는
# 스위트 전체 PASS 가 기준이고, `run: true` 계층 미선언 호스트에서는 그 단계가 무출력으로 지나감.
# 아래는 켤 때의 모양(주석 유지 — 활성 블록으로 두면 /vdev-init 이 모든 호스트에 이 값을 그대로
# 심어, 그 호스트에 없는 suite 이름이 영구 미충족을 만듦).
# promotion_verification:
#   exit_criteria:
#     scope: [smoke, regression]   # 이 suite 들이 회차의 scope 에 다 들어야 충족
#     allow_blocked: false         # BLOCKED 가 하나라도 있으면 미충족. BLOCKED 는 FAIL 이
#                                  # 아니지만 "돌았다" 도 아님

# 게이트 증거. review·doc-sync 마커는 편집이 일어나면 무효화되므로 통과는 고정점이다 — 그러지
# 않으면 통과 뒤의 수정이 어떤 리뷰어도 본 적 없는 코드 위에서 번 증거로 커밋된다.
# false 면 편집이 마커를 지우지 않는다: 리뷰 뒤의 작은 수정이 재실행을 물지 않고 리뷰 없이
# 커밋되는 옛 순서. 대가와 읽는 규칙은 rules/gate-mechanics.md "증거 무효화 스위치".
gate_evidence:
  invalidate_on_edit: true

# 문서 동기화 (doc-sync)
doc_sync:
  # 인덱스 문서 (프로젝트 루트에 배치)
  index: CLAUDE.md

  # 동기화할 문서 디렉토리 (glob 패턴)
  dirs:
    - "docs/"
    - ".claude/rules/"

  # 서비스별 로컬 CLAUDE.md (glob 패턴)
  service_docs: "services/*/CLAUDE.md"

# LLM Wiki (임베딩 없음). 키가 없거나 enable:false 면 wiki 게이트는 아무것도 하지 않는다.
# graph.yaml 은 doc-sync 가 생성하고, 커밋 게이트는 읽기 전용이다 — 검증만 하고 생성하지 않는다.
# 이 키는 /wiki-init 이 쓰고, 같은 자리에서 .github/workflows/wiki-verify.yml 을 제안한다 —
# /vdev-init 은 wiki 워크플로를 렌더하지 않는다. 가리킬 그래프가 없기 때문이다.
wiki:
  enable: false
  root: docs/                # wiki 루트. harness-init 산출물과 같은 트리
  index: docs/index.md       # 그래프 진입점 (orphan 판정 기준)
  max_lines: 400             # 한 파일 한 개념 lint. 0 = 끄기
  context_lines: 2000        # --neighbors 기본 예산(줄). 약 20k 토큰
  defect_rule_threshold: 3   # 같은 tag 가 N건 → Rule 승격 경고. 0 = 끄기

# 산문 문체 규율(rules/doc-style.md). 블록이 없거나 enable:false 면 doc-style 게이트가 아무것도
# 안 한다. 커밋 게이트는 커밋이 바꾸는 파일만 보고 **경고만** 하고, 판정은 아래 paths 전체를
# 보는 .github/workflows/doc-style.yml 이 한다 — 그래서 enable:false 는 더 가벼운 검사가
# 아니라 검사 없음이다.
# 두 레이어가 이 플래그 하나를 읽는다: /vdev-init 은 이것이 true 일 때만 저 워크플로를
# 렌더하고, 검사 스크립트는 이것이 거짓이면 자기 경로 목록을 비운다 — 되돌리면 이미 렌더된
# 워크플로가 삭제 없이 조용해진다. 단 이 파일이 YAML 로 안 읽히면 false 여도 붉다: 그동안 커밋
# 게이트가 미분류 커밋도 통과시키므로 그것을 알리는 자리로 남긴다(rules/gate-mechanics.md).
doc_style:
  enable: false
  # 저장소 루트 기준 glob: `*`·`?` 는 `/` 에서 멈추고, 세그먼트 통째인 `**` 는 디렉터리를
  # 0개 포함해 몇 겹이든 잇는다(`docs/**/*.md` 가 `docs/a.md` 도 덮는다). 끝의 `**` 는 서브트리.
  # 주석·독스트링이 기본에 들어 있다 — doc-style.md 맨 위 적용 줄이 그것도 산문이라 부른다.
  # 문서만 보려면 `["**/*.md"]` 로 줄인다.
  paths: ["**/*.md", "**/*.py", "**/*.sh", "**/*.bash"]
  # 범위 밖으로 뺄 glob — 서브트리는 `dir/**`, 직속 자식은 `dir/*`.
  # CHANGELOG.md 가 깊이 무관하게 기본인 이유: 릴리스 도구가 커밋 제목으로 이걸 재생성하므로
  # (모노레포는 패키지마다), 금지어를 담은 제목 하나가 CI 를 영구히 붉게 만들고 고칠 편집이 없다. superpowers 트리 둘은 반대편에서
  # 같은 이유로 기본이다: 플랜은 체크리스트 줄과 자기 경로 포인터로 이뤄지고 그것이 곧 PLAN
  # 규칙이 금지하는 것이라, 문서를 어떻게 고쳐도 통과하지 못한다. 벤더링 문서·생성 산출물도 여기로.
  # 도구가 만드는 코드(마이그레이션·스텁·프로토콜 바인딩)가 그것이다: 사람이 안 쓴 주석이라
  # 고칠 편집이 없고, 다음 생성이 되돌린다.
  # 벤더·가상환경 트리와 GitHub 이슈·PR 템플릿은 `paths` 와 무관하게 늘 빠지므로 여기 적을
  # 필요가 없다(이름 목록은 docs/usage/daily-work.md '문체 규율'). 반대로 `build`·`dist`·`env`·`target` 은 손으로 쓴 소스일 수도 있어 자동으로
  # 안 빠진다 — 생성물이면 여기 적는다.
  exclude: ["**/CHANGELOG.md", "docs/superpowers/**", ".superpowers/**"]

# REST API 계약 테스트 (CI 전용 — GitHub Actions). REST API 없으면 enable:false → 미설치.
# /vdev-init 이 이 값을 읽어 .github/workflows/api-contract.yml 을 렌더링한다.
contract_test:
  enable: true
  # 이 워크플로우가 동작할 브랜치 (push/PR 모두). 직접 나열 — 확장 자유.
  # GitHub Actions 브랜치 필터 문법 그대로 사용 가능 (예: 'release/**').
  # 보통 협업/promotion 브랜치. feature/* 는 넣지 않는다(무거운 검증 제외).
  branches: [dev, stage, main]
  # 셋업 시 웹 확인으로 pin (정체 도구 회피). CI는 이 고정값으로 결정적 실행.
  tool: schemathesis
  action_ref: "schemathesis/action@v3"   # 메이저 핀
  # OpenAPI 스펙 위치 (서버 URL 경로 또는 레포 내 파일 경로)
  schema: "http://localhost:8000/openapi.json"
  base_url: "http://localhost:8000"
  # 서버 기동 = docker compose
  server:
    compose_file: "docker-compose.yml"
    health_url: "http://localhost:8000/health"
    health_timeout: 60                    # 초

# 의미기반 버전/릴리스 (다운스트림 = 일반 패키지). /vdev-init 이 이 값으로
# .github/workflows/ 를 렌더한다(api-contract 와 동일 패턴). 안 쓰면 enable:false → 미설치.
# release_tool 은 harness-init 리서치가 스택에 맞게 채운다.
versioning:
  enable: true
  # 스택별 릴리스 도구. 자동 렌더 템플릿 보유: python-semantic-release | semantic-release(node)
  # | jreleaser(java) | gitversion(c#) | cargo-release(rust) | sbt-ci-release(scala).
  # 그 외 도구(Go goreleaser, C++ 등)는 /vdev-init 이 release.yml 을 자동 생성하지 못하고
  # AI 가 감지 스택에 맞춰 직접 작성한다(vdev-init SKILL Step 2.7).
  release_tool: python-semantic-release
  # 버전 bump 대상 file:field (스택별). python: pyproject.toml:project.version / node: package.json:version
  version_files: ["pyproject.toml:project.version"]
  branches:
    stable: main        # 정식 릴리스
    prerelease: stage   # rc 프리릴리스 (없으면 빈 문자열)
  branch_naming:
    enable: true
  entropy:
    enable: true
    schedule: "0 0 * * 5"   # 주간 cron (UTC)
    paths: ["src/"]          # 복잡도/파일크기 측정 경로

# 유닛 테스트 CI (GitHub Actions). /vdev-init 이 이 값으로 unit-test.yml 을 렌더한다.
# 안 쓰면 enable:false → 미설치.
#
# 런타임 파생 없음 — 렌더러는 이 블록만 순수 치환하며 modules 나 코드베이스를 읽지 않는다.
# 초안은 /vdev-init 이 modules[].checks.test 를 시드/변환해 작성하고(코드 스택 감지가
# 아니다 — 그건 harness-init 영역), 사람이 수정한다. config 가 최종 권한이다.
# modules(커밋 게이트 SSOT)와 unit_test(CI SSOT)는 시점·용도가 달라 분리한다.
unit_test:
  enable: true
  # 이 워크플로우가 동작할 push 브랜치 (contract_test 와 동일 패턴; feature/* 제외)
  branches: [dev, stage, main]
  # job-level 타임아웃(분). 기본은 타이트하게 — 필요하면 팀이 올린다.
  timeout_minutes: 15
  # 모듈별 테스트 매트릭스. 각 항목이 GitHub Actions matrix.include 한 줄이 된다.
  jobs:
    - name: api
      # 공식 setup action 택일 키: python | node | java | go | rust
      # 그 외 언어(scala·c# 등)는 "" 로 두고 아래 setup 셸이 런타임을 전담한다.
      # 대소문자 무관(렌더 시 casefold 로 매칭 후 소문자로 정규화) — 그래도 소문자
      # 로 쓰는 것을 권장한다. name 을 비워 두면 렌더 시 job-1, job-2… 로 자동 채워진다.
      language: python
      # setup action 에 넘길 런타임 버전. rust 는 toolchain 이름(예: stable).
      # language 가 python|node|java|go|rust 중 하나면 version 은 **필수**다 — 비우면
      # 해당 공식 action 이 자기 default 대신 빈 문자열을 그대로 받아 실패한다. 그런
      # job 은 /vdev-init 렌더 시 matrix 에서 제외되고 [!] 로 보고된다.
      version: "3.12"
      # 의존성/런타임 준비 명령. 공식 action 으로 안 되는 것은 전부 여기서.
      setup: "pip install uv && uv sync"
      # 테스트 실행 명령 (필수 — 없는 job 은 렌더 시 제외된다)
      test: "uv run pytest"

# E2E CI 안전망(CI 전용 — GitHub Actions). Playwright 스위트만 대상이고, 브라우저 프런트가
# 없으면 enable:false 로 두면 아무것도 설치되지 않는다. enable:true 면 /vdev-init 이
# .github/workflows/e2e.yml 을 **그대로 복사**한다(치환 토큰 없음) — 소비자가 소유하고 고치는
# 출발점이라, 나중에 플러그인 템플릿을 고쳐도 이미 만들어진 파일에는 닿지 않는다. 아무것도
# 차단하지 않는다 — 필수 상태 검사로 승격시키기 전에 docs/usage/ci-workflows.md 의 'E2E 안전망' 을 읽을 것.
# 주의: 이 플래그는 **렌더 스위치**다. false 로 되돌려도 이미 렌더된 e2e.yml 은 계속 돈다 —
# 멈추려면 그 파일을 지운다.
e2e:
  enable: false

# 배포 CI (GitHub Actions). /vdev-init 이 이 값으로 오케스트레이터 deploy.yml 을 생성하고
# 타깃 컴포넌트(deploy-<target>.yml)를 정적 복사한 뒤, release.yml 에 호출 job 을 배선한다.
# 안 쓰면 enable:false → 미설치.
#
# 런타임 파생 없음 — 렌더러는 이 블록만 읽는다. 초안은 /harness-deployments 스킬이
# 스택 감지·리서치로 작성하고, 사람이 수정한다. config 가 최종 권한이다.
#
# config 는 파생 불가능한 것만 담는다. release.yml 의 deploy 호출 job(needs·if·uses·
# permissions)은 전부 계산되므로 여기 없다 — 유일한 예외가 custom 의 permissions 다.
deploy:
  enable: false
  # 배포 순서. 생략하면 전부 병렬. 나열된 순서대로 needs 체인이 걸린다.
  # order: [pypi, api-image]
  targets:
    - name: pypi              # job id. 비우면 job-1, job-2 … 로 자동 채움
      target: pypi            # pypi | npm | maven-central | cratesio | ghcr | custom
      # auth: oidc(신뢰발행) | token. pypi 기본값은 token 이다 — 재사용 워크플로
      # (deploy.yml → deploy-pypi.yml)에서는 PyPI trusted publishing(OIDC)이 동작하지
      # 않는다(pypa/gh-action-pypi-publish README — 미해결, pypa/warehouse#11096).
      # npm·cratesio 는 최상위 호출 워크플로로 매칭되어 재사용 워크플로에서도 OIDC 가
      # 동작하므로 oidc 를 그대로 써도 된다.
      auth: token
      version: "3.12"         # 런타임 언어 버전(비우면 컴포넌트 기본값)
      build: "uv build"       # dist/* 를 만드는 명령. 비우면 빌드 스텝 생략

    # - name: api-image
    #   target: ghcr
    #   image: ghcr.io/OWNER/REPO/api   # 필수
    #   context: services/api           # 생략 시 "."
    #   dockerfile: services/api/Dockerfile   # 생략 시 "<context>/Dockerfile"

    # - name: central
    #   target: maven-central
    #   build_tool: gradle    # maven | sbt | gradle  (필수)
    #   version: "21"         # JDK
    #   # publish 는 **필수이며 기본값이 없다**. Sonatype Central Portal 의 publishingType
    #   # 기본값이 USER_MANAGED 라, 업로드만 하는 태스크를 고르면 CI 는 초록불인데
    #   # Maven Central 에 아무것도 올라가지 않는다. 의식적으로 고르세요:
    #   #   maven : "mvn -B deploy"                     (pom.xml 의 autoPublish=true 필요)
    #   #   gradle: "./gradlew publishAndReleaseToMavenCentral"   (업로드만: publishToMavenCentral)
